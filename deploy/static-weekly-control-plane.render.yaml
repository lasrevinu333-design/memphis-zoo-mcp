services:
  - type: web
    name: memphis-zoo-static-weekly-control-plane
    runtime: node
    plan: starter
    region: virginia
    repo: https://github.com/lasrevinu333-design/memphis-zoo-mcp
    branch: main
    buildCommand: npm ci --ignore-scripts
    startCommand: npm run start:static-weekly-control-plane
    healthCheckPath: /healthz
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPS_MANAGER_SESSION_SECRET
        sync: false
      - key: STATIC_WEEKLY_CONTROL_PLANE_DATABASE_URL
        sync: false
      - key: STATIC_WEEKLY_CONTROL_PLANE_DATABASE_CA_PEM
        sync: false
      - key: STATIC_WEEKLY_CONTROL_PLANE_ALLOWED_ORIGINS
        value: https://lasrevinu333-design.github.io
      - key: MEMPHIS_RELEASE_ATTESTATION_JSON
        sync: false
      - key: MEMPHIS_RELEASE_ATTESTATION_PUBLIC_KEY
        sync: false
