name: Apply schedule and messenger foundation repair

on:
  push:
    branches:
      - release/schedule-messaging-20260715
    paths:
      - .github/workflows/_apply_schedule_messaging_20260715.yml

permissions:
  contents: write

concurrency:
  group: schedule-messaging-foundation-20260715
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact frontend fixtures
        uses: actions/checkout@v4
        with:
          repository: lasrevinu333-design/Engine
          ref: main
          path: _engine_fixture
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/schedule_messaging_backend/chunk_* | base64 --decode | gzip --decompress > /tmp/schedule-messaging.patch
          printf '%s  %s\n' '28a1ef00d33be95d74375db00fe739da16df4502e6aaf62df72106ec1d89cba6' /tmp/schedule-messaging.patch | sha256sum --check
          git apply --check /tmp/schedule-messaging.patch
          git apply /tmp/schedule-messaging.patch
          git diff --check
          rm -rf "$GITHUB_WORKSPACE/../Engine"
          ln -s "$GITHUB_WORKSPACE/_engine_fixture" "$GITHUB_WORKSPACE/../Engine"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run complete backend regression and security gate
        shell: bash
        run: |
          set -euo pipefail
          for test_script in \
            smoke \
            test:schedule-display \
            test:messaging-recovery \
            test:events-parser \
            test:events-api \
            test:feedback \
            test:schedule-ai \
            test:ai-intent \
            test:messaging \
            test:auth \
            test:device-popups \
            test:thursday-demo \
            test:leadership-demo \
            test:dashboard \
            test:scheduler-overhaul \
            test:sch2-publish \
            test:foundation
          do
            npm run --silent "$test_script"
          done
          for file in src/*.js src/ai/*.js scripts/*.mjs; do
            node --check "$file"
          done
          npm audit --omit=dev --audit-level=high

      - name: Publish only the tested source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _engine_fixture .repair
          rm -f .github/workflows/_apply_schedule_messaging_20260715.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix schedule display and Memphis Messenger foundation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
