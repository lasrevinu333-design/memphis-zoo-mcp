name: Apply Moxie Authentication Repair

on:
  push:
    branches: [fix/moxie-auth-logout-icons-20260716]

permissions:
  contents: write

concurrency:
  group: apply-moxie-auth-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/moxie-auth-logout-icons-20260716
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --unidiff-zero .repair/moxie-auth-logout-icons.patch
          git apply --unidiff-zero .repair/moxie-auth-logout-icons.patch
          rm .repair/moxie-auth-logout-icons.patch
          rmdir .repair
          git diff --check
      - name: Install and validate backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          while IFS= read -r file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          tests=(
            custodial-operational-notes-tests.mjs
            dashboard-recent-activity-contract-tests.mjs
            demo-leadership-blank-schedule-tests.mjs
            device-credential-foundation-tests.mjs
            events-api-contract-tests.mjs
            events-parser-tests.mjs
            feedback-contract-tests.mjs
            foundation-repair-tests.mjs
            full-window-absence-coverage-tests.mjs
            manager-open-session-foundation-tests.mjs
            memphis-messaging-regression-tests.mjs
            memphis-messaging-route-recovery-tests.mjs
            moxie-route-tests.mjs
            sch2-publish-route-tests.mjs
            schedule-ai-tests.mjs
            schedule-display-tests.mjs
            schedule-source-type-contract-tests.mjs
            scheduler-alerts-gps-foundation-tests.mjs
            scheduler-overhaul-contract-tests.mjs
            shared-access-auth-tests.mjs
            smoke-ai-intent.mjs
            smoke-ai-utils.mjs
            smoke-memphis-context.mjs
            smoke.mjs
            thursday-notification-presentation-tests.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            node "scripts/$test_file"
          done
          npm audit --omit=dev --audit-level=high
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_apply_moxie_auth_repair.yml
          git add -A
          git config user.name 'custodial-foundation-bot'
          git config user.email 'custodial-foundation-bot@users.noreply.github.com'
          git commit -m 'fix: require Moxie login and repair logout and artwork [skip ci]'
          git push origin HEAD:fix/moxie-auth-logout-icons-20260716
