name: Apply Named Leadership Contract Marker V2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/apply-named-leadership-contract-marker.mjs'
      - '.github/workflows/apply-named-leadership-contract-marker-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply auth contract marker
        run: node .batch/apply-named-leadership-contract-marker.mjs
      - name: Verify named leadership contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check src/index.js
          npm run --silent test:operations-leadership-mobile
          git diff --check
      - name: Commit contract marker
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js
          git commit -m 'release: publish named leadership auth contract marker'
          git push origin HEAD:"$HEAD_BRANCH"
