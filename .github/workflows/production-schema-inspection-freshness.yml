name: Production schema inspection freshness

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character main commit to execute
        required: true
        type: string
      backup_run_id:
        description: Fresh successful disaster-recovery backup run for this exact commit
        required: true
        type: string
      confirmation:
        description: Type the exact reviewed migration confirmation shown in the PR
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-schema-inspection-freshness
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Require exact main-only reviewed inputs
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_OWNER" = "lasrevinu333-design"
          test "$GITHUB_ACTOR" = "lasrevinu333-design"
          test "$GITHUB_TRIGGERING_ACTOR" = "lasrevinu333-design"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "APPLY 20260809125735 5629870fc9bfece9cec6f8a8182cca579c4070a8e9552039d4a1bb3035ae2052 c6742e500c2a5d3767f1d886bb5937167eab42730f8271eec76b427a10c5f302 333ddfc8008ea0b85916de7d491b98c9b8d6a7d45d3a2947d99b4b3bb836ea00"
      - name: Verify owner, exact main tip, and fresh exact-commit backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: node scripts/production-schema-c674-github-evidence.mjs --evidence-out "${{ runner.temp }}/guard-evidence.json"

  migrate:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require configured production database secrets
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SUPABASE_DB_URL"
          test -n "$PRODUCTION_SUPABASE_PROJECT_REF"
      - name: Reverify owner, exact main tip, and fresh backup before database preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/inspection-freshness-evidence"
          node scripts/production-schema-c674-github-evidence.mjs \
            --evidence-out "${{ runner.temp }}/inspection-freshness-evidence/github-evidence.json"
      - name: Build isolated single-file migration directory
        env:
          ISOLATED_DIR: ${{ runner.temp }}/inspection-freshness-isolated/supabase/migrations
        run: |
          set -euo pipefail
          install -d -m 0700 "$ISOLATED_DIR"
          install -m 0600 \
            release/reviewed-migrations/20260809125735_cleaning_inspection_24_hour_freshness.sql \
            "$ISOLATED_DIR/20260809125735_cleaning_inspection_24_hour_freshness.sql"
          shopt -s nullglob dotglob
          entries=("$ISOLATED_DIR"/*)
          test "${#entries[@]}" -eq 1
          test "$(sha256sum "${entries[0]}" | cut -d' ' -f1)" = \
            "5629870fc9bfece9cec6f8a8182cca579c4070a8e9552039d4a1bb3035ae2052"
      - name: Read-only preflight of exact migration and production state
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_CA_CERT_PATH: ${{ github.workspace }}/.github/certs/prod-ca-2021.crt
        run: |
          set -euo pipefail
          node scripts/production-schema-inspection-freshness.mjs \
            --mode preflight \
            --migration-dir "${{ runner.temp }}/inspection-freshness-isolated/supabase/migrations" \
            --evidence-out "${{ runner.temp }}/inspection-freshness-evidence/preflight.json"
          node -e '
            const fs = require("node:fs");
            const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!evidence.ok || evidence.mode !== "preflight" || !evidence.ready_to_apply ||
                evidence.migration.migration_count !== 1 ||
                evidence.migration.sha256 !== "5629870fc9bfece9cec6f8a8182cca579c4070a8e9552039d4a1bb3035ae2052" ||
                evidence.before.physical.fingerprint !== "c6742e500c2a5d3767f1d886bb5937167eab42730f8271eec76b427a10c5f302") process.exit(1);
          ' "${{ runner.temp }}/inspection-freshness-evidence/preflight.json"
      - name: Reverify exact main and backup immediately before apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          node scripts/production-schema-c674-github-evidence.mjs \
            --evidence-out "${{ runner.temp }}/inspection-freshness-evidence/pre-apply-github-evidence.json"
      - name: Apply exactly one reviewed migration atomically
        id: apply
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_CA_CERT_PATH: ${{ github.workspace }}/.github/certs/prod-ca-2021.crt
          PRODUCTION_SCHEMA_INSPECTION_FRESHNESS_APPLY: '20260809125735'
        run: |
          set -euo pipefail
          node scripts/production-schema-inspection-freshness.mjs \
            --mode apply \
            --migration-dir "${{ runner.temp }}/inspection-freshness-isolated/supabase/migrations" \
            --evidence-out "${{ runner.temp }}/inspection-freshness-evidence/apply.json"
      - name: Independently post-verify catalog, ledger, trigger, ACL, and compatibility
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_CA_CERT_PATH: ${{ github.workspace }}/.github/certs/prod-ca-2021.crt
        run: |
          set -euo pipefail
          node scripts/production-schema-inspection-freshness.mjs \
            --mode verify \
            --migration-dir "${{ runner.temp }}/inspection-freshness-isolated/supabase/migrations" \
            --evidence-out "${{ runner.temp }}/inspection-freshness-evidence/post-verify.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-schema-inspection-freshness-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/inspection-freshness-evidence
          retention-days: 14
          if-no-files-found: error
