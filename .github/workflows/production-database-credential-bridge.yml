name: Production database credential bridge

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed main commit to execute
        required: true
        type: string
      confirmation:
        description: Exact one-time bridge confirmation from the reviewed PR
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-credential-bridge
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Require exact owner, main, first attempt, and reviewed confirmation
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lasrevinu333-design/memphis-zoo-mcp"
          test "$GITHUB_REPOSITORY_OWNER" = "lasrevinu333-design"
          test "$GITHUB_ACTOR" = "lasrevinu333-design"
          test "$GITHUB_TRIGGERING_ACTOR" = "lasrevinu333-design"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "SEAL VERIFIED RQQU DATABASE CREDENTIALS C674 20260809"
      - run: npm ci --ignore-scripts
      - name: Verify legacy credential against exact production and seal corrected credentials for GitHub
        env:
          LEGACY_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_CA_CERT_PATH: ${{ github.workspace }}/.github/certs/prod-ca-2021.crt
          SEALED_SECRET_OUT: ${{ runner.temp }}/production-db-credentials-sealed.json
        run: node scripts/production-database-credential-bridge.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-db-password-sealed-${{ github.run_id }}
          path: ${{ runner.temp }}/production-db-credentials-sealed.json
          retention-days: 1
          if-no-files-found: error
