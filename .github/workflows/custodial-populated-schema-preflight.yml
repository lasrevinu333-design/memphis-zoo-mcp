name: Custodial Populated Schema Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custodial-populated-schema-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-source-fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require configured read-only production MCP
        env:
          SCHEMA_FINGERPRINT_MCP_URL: ${{ secrets.SCHEMA_FINGERPRINT_MCP_URL }}
        run: test -n "$SCHEMA_FINGERPRINT_MCP_URL"
      - name: Verify exact populated source schema without mutation
        env:
          SCHEMA_FINGERPRINT_MCP_URL: ${{ secrets.SCHEMA_FINGERPRINT_MCP_URL }}
        run: |
          set -euo pipefail
          npm run --silent release:populated-schema:preflight | tee /tmp/custodial-populated-schema-preflight.json
          test -s /tmp/custodial-populated-schema-preflight.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: custodial-populated-schema-preflight-${{ github.sha }}
          path: /tmp/custodial-populated-schema-preflight.json
          if-no-files-found: error
          retention-days: 30
