name: Apply Operational Recovery Source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-operational-recovery-source
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/operations-first-20260716
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunk-sha256 <<'EOF'
          8920b4320c372c0a0f96395ba03873aaa5fec5f23327e776badf14a2c28d1bfe  .recovery-transfer/part-00
          5249136e2a9aa534b1e2e1cab42b486dbb33fead6500bac63d4d329003fb71f5  .recovery-transfer/part-01
          2593c03109e9bfa1c825138b95f3a8c254c1f8ea2e7a669b1e9776e0dcdbe9d0  .recovery-transfer/part-02
          1954ae7f42b062f3992bb5ca5301280cd33cf80731fd3d213b2c6d966b3644df  .recovery-transfer/part-03
          EOF
          sha256sum -c /tmp/chunk-sha256
          cat .recovery-transfer/part-* > /tmp/operations-first.patch.gz.b64
          test "$(sha256sum /tmp/operations-first.patch.gz.b64 | awk '{print $1}')" = "5752c6987a6b3ea002263212bb626d1c299d5c41a1de520b6e87515e6bac959e"
          base64 -d /tmp/operations-first.patch.gz.b64 > /tmp/operations-first.patch.gz
          test "$(sha256sum /tmp/operations-first.patch.gz | awk '{print $1}')" = "cb5c636e9f9f6f6a143e485f5f4297c0f98bd33e66f68df651ca46cb706441ab"
          gzip -dc /tmp/operations-first.patch.gz > /tmp/operations-first.patch
          test "$(sha256sum /tmp/operations-first.patch | awk '{print $1}')" = "4c7489ce5f4ab2fa4fedc3df7fd09adb24a78e3f51db3ad4d125e50d52297d30"
          git apply --check /tmp/operations-first.patch
          git apply /tmp/operations-first.patch
          git diff --check

      - name: Install and validate complete deterministic backend matrix
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          while IFS= read -r file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          npm audit --omit=dev --audit-level=high
          tests=(
            custodial-operational-notes-tests.mjs
            dashboard-recent-activity-contract-tests.mjs
            demo-leadership-blank-schedule-tests.mjs
            device-credential-foundation-tests.mjs
            device-popup-fully-kiosk-test.mjs
            events-api-contract-tests.mjs
            events-parser-tests.mjs
            feedback-contract-tests.mjs
            full-window-absence-coverage-tests.mjs
            manager-open-session-foundation-tests.mjs
            memphis-messaging-regression-tests.mjs
            memphis-messaging-route-recovery-tests.mjs
            moxie-route-tests.mjs
            operational-recovery-tests.mjs
            sch2-publish-route-tests.mjs
            schedule-ai-tests.mjs
            schedule-display-tests.mjs
            schedule-source-type-contract-tests.mjs
            scheduler-alerts-gps-foundation-tests.mjs
            scheduler-overhaul-contract-tests.mjs
            shared-access-auth-tests.mjs
            smoke-ai-intent.mjs
            smoke-ai-utils.mjs
            smoke-memphis-context.mjs
            smoke.mjs
            thursday-notification-presentation-tests.mjs
            thursday-notification-presentation.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            node "scripts/$test_file"
          done

      - name: Commit verified application source
        shell: bash
        run: |
          set -euo pipefail
          git add package.json src scripts supabase/migrations
          git diff --cached --check
          git config user.name 'custodial-recovery-bot'
          git config user.email 'custodial-recovery-bot@users.noreply.github.com'
          git commit -m 'fix: restore operations-first custodial workflows'
          git push origin HEAD:recovery/operations-first-20260716
