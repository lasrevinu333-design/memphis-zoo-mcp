name: Isolated original286 official Storage qualification only
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Root reviewed exact synthetic Source20 qualification once
        required: true
        type: choice
        options:
          - HOLD
          - ROOT_REVIEWED_PRIVATE286_SOURCE20_ONCE
        default: HOLD
permissions:
  contents: read
concurrency:
  group: isolated-original286-official-storage-qualification
  cancel-in-progress: false
jobs:
  isolated-private286:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/custodial-g31-private286-isolated-qualification-20261026' && inputs.confirm == 'ROOT_REVIEWED_PRIVATE286_SOURCE20_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qualification-control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bc79b77231389c382751f6092a23ab0a75c2982b
          path: product-source20
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b20499c6a98b90db1779fe5d0060b619bceae261
          path: original-source286
          persist-credentials: false
      - name: Same maintained private qualification once
        env:
          ROOT_REVIEWED_CONFIRM: ${{ inputs.confirm }}
        run: |
          python3 qualification-control/.github/qualification/run-private286-isolated.py \
            "$ROOT_REVIEWED_CONFIRM" \
            qualification-control/.github/qualification/G31_SOURCE20_SYNTHETIC_QUALIFICATION_SUPPORT.tar.gz \
            product-source20 original-source286
      - name: Preserve original synthetic custody only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g31-private286-original-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g31-external-custody
            /mnt/ai_models/codex-preserved-custodial/current-source-staging-20261024/atomic-finalization/G31-private286-official-nonempty-owning-fixture-DRAFT-source01/remote01-Source17-existing-actions-isolated-private286-PREP_ONLY/source20-prebind-final08/actual-private286-official-provider-once
          if-no-files-found: warn
          retention-days: 7
