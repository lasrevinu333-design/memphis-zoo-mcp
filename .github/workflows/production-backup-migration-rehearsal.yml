name: G12 current48031 consistent derived physical clone
'on':
  workflow_dispatch:
    inputs:
      confirm:
        type: choice
        required: true
        options:
        - FRESH40454607125_CURRENT48031_PHYSICAL_G12_ONLY
permissions:
  actions: read
  contents: read
concurrency:
  group: custodial-g12-current48031-physical-clone
  cancel-in-progress: false
jobs:
  clone:
    if: github.ref == 'refs/heads/codex/custodial-g12-current48031-physical-clone-20261027' && inputs.confirm == 'FRESH40454607125_CURRENT48031_PHYSICAL_G12_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 4803109c968d874519f9dec2278089971bf3530b
        path: product
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.4
    - run: npm ci --ignore-scripts
      working-directory: product
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: memphis-zoo-disaster-recovery-40454607125
        path: ${{ runner.temp }}/encrypted-backup
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: '40454607125'
    - name: Verify, independently restore, and attack the production snapshot
      shell: bash
      env:
        REHEARSAL_SCOPE: full_candidate
        OFFICIAL_LOCAL_STORAGE_PROVIDER: 'false'
        BACKUP_RUN_ID: '40454607125'
        REVIEWED_DISPOSITION_SHA256: ''
        GH_TOKEN: ${{ github.token }}
        BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        RESTORE_ARCHIVE_VERIFY_KEY: ${{ secrets.BACKUP_MANIFEST_SIGNING_KEY }}
        RESTORE_ARCHIVE_VERIFY_KEY_ID: ${{ vars.BACKUP_MANIFEST_SIGNING_KEY_ID }}
        REHEARSAL_GITHUB_TOKEN: ${{ github.token }}
      run: bash ../scripts/g12-derive-physical-clone-from-current.sh
      working-directory: product
    - name: Upload only recipient ciphertext and nonsecret custody
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: g12-current48031-physical-ciphertext-${{ github.run_id }}
        path: ${{ runner.temp }}/g12-physical-ciphertext/
        if-no-files-found: error
        retention-days: 1
    - name: Reconcile only recorded plaintext work
      if: always()
      run: node --input-type=module -e "import fs from 'node:fs'; import {cleanupOwnedWork} from './scripts/g12-verified-backup-transfer.mjs';
        const p=fs.realpathSync(process.env.RUNNER_TEMP); const f=p+'/g12-physical-export-owned-work.json'; if(fs.existsSync(f))
        console.log(JSON.stringify(cleanupOwnedWork(f,p))); else console.log(JSON.stringify({receipt_present:false,cleanup_claim:'NO_RECORDED_RESOURCE_AUTHORITY'}));"
