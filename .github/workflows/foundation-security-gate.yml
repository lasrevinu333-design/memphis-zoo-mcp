name: Foundation Security Gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: foundation-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Reviewed phone, pair, and isolated recorder regressions
        shell: /usr/bin/env -i HOME=/home/runner PATH=/opt/hostedtoolcache/node/22.23.1/x64/bin:/usr/bin:/bin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          docker pull supabase/postgres@sha256:fbf77524fc188126c1775fd2d2e54040bde295438a3e6f07936f3c39e6f688ed
          /usr/bin/sha256sum --check --strict <<'REVIEWED_INPUTS'
          ccbab61c3c4ff9170b5bc3cb7e9a1348160f662e7bca7280ddce1168097f233a  package.json
          ad1352fdd9867022c6404a2bf1ae3ebc516fd74ff5e52c7f4bdd4a417bf0d139  package-lock.json
          d8ad584e8dd3adf8be9aa04bf7287fb45ed8805f7d771c814183cc781e8e2149  scripts/legacy-activation-http-tests.mjs
          b2fe3d3dd2c1b7619d5cb7869a865ef44284269264cd6e0f931cdbbf930141d0  scripts/release-pair-consumer-regression-tests.mjs
          9c330f91a9795187cbfb1edb92f2283b121935b609169e33effdb07f52e88e12  scripts/run-isolated-release-recorder-tests.mjs
          c2b5f2f3324cd7615844cfb3c458c4e1febc11ce7e8c4f05368567fce1e64cfe  scripts/production-release-recorder-database-tests.mjs
          6a0c4211cedb1379501769b6944c4821762a4015cb00dca09f40fe1f647a1329  scripts/fixtures/exact-frontend-pair.mjs
          REVIEWED_INPUTS
          /opt/hostedtoolcache/node/22.23.1/x64/bin/node scripts/legacy-activation-http-tests.mjs && /opt/hostedtoolcache/node/22.23.1/x64/bin/node scripts/release-pair-consumer-regression-tests.mjs && /opt/hostedtoolcache/node/22.23.1/x64/bin/node scripts/run-isolated-release-recorder-tests.mjs
      - name: Syntax and dependency audit
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/auth/shared-access-auth.js
          node --check src/auth/mcp-connector-auth.js
          node --check src/leadership-bootstrap.js
          node --check src/custodial-employee-admin.js
          node --check src/manager-notifications.js
          node --check src/annie-moxie-bootstrap.js
          npm audit --omit=dev --audit-level=high
      - name: Verify exact release evidence freshness
        run: npm run --silent release:integrated-backend-authority:check
      - name: Record closure toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          printf '{"image_os":"%s","image_version":"%s","node":"%s","postgres_image":"%s"}\n' \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$(node --version)" \
            "$(docker image inspect supabase/postgres@sha256:fbf77524fc188126c1775fd2d2e54040bde295438a3e6f07936f3c39e6f688ed --format '{{.Id}}')" \
            > closure-toolchain-provenance.json
      - name: Provision exact selected fresh PostgreSQL image
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          image='public.ecr.aws/supabase/postgres@sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518'
          node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("release/fresh-only-replay/MANIFEST.json")).image!==process.argv[1]) process.exit(1)' "$image"
          evidence="$RUNNER_TEMP/ci-fresh-only-failure-evidence/pinned-pg-provisioning"
          mkdir -m 700 -p "$evidence"
          for attempt in 1 2 3; do
            printf '%s\n' "$image" > "$evidence/$attempt.image"
            set +e
            timeout --signal=TERM --kill-after=5s 45s docker pull "$image" > "$evidence/$attempt.stdout" 2> "$evidence/$attempt.stderr"
            code=$?
            set -e
            printf '%s\n' "$code" > "$evidence/$attempt.actual-exit"
            if [ "$code" -eq 0 ]; then
              docker image inspect --format '{{json .RepoDigests}}' "$image" > "$evidence/verified-repo-digests.json"
              node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync(process.argv[1])); if(!Array.isArray(a)||!a.includes(process.argv[2])) process.exit(1)' "$evidence/verified-repo-digests.json" "$image"
              exit 0
            fi
            cat "$evidence/$attempt.stderr" >&2
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'toomanyrequests|rate exceeded|HTTP[^0-9]*429|status[^0-9]*429' "$evidence/$attempt.stderr" "$evidence/$attempt.stdout"; then
              exit "$code"
            fi
            sleep "$((attempt * 5))"
          done
      - name: Authentication and integration contracts
        run: |
          set -euo pipefail
          npm run --silent test:auth
          npm run --silent test:foundation-containment
          npm run --silent test:readonly-database-authority
          npm run --silent test:operations-leadership-mobile
          npm run --silent test:manager-notifications
          npm run --silent test:custodial-employee-phones
          npm run --silent test:messaging
          npm run --silent test:messaging-manager-authority
          npm run --silent test:batch2
          npm run --silent test:moxie-route
          npm run --silent test:schedule-source-type
          npm run --silent test:foundation
          npm run --silent test:foundation-repair
          npm run --silent test:scheduler-overhaul
          npm run --silent test:static-weekly-scheduler:fast
          # This starts only disposable worker-owned PostgreSQL containers and
          # includes the real independent-session concurrency/restart suite.
          npm run --silent test:static-weekly-scheduler:database
          npm run --silent test:integrated-backend-authority-suite-order
          npm run --silent test:integrated-backend-authority-release-provenance
          npm run --silent test:release-closure
          npm run --silent test:final-closure-database-isolated
          npm run --silent test:ci-workflows
          npm run --silent test:release-migration-authorization
          npm run --silent test:release-migration-plan-db-isolated
          npm run --silent test:isolated-restore-lease-shim
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: closure-toolchain-provenance-${{ github.run_id }}
          path: closure-toolchain-provenance.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ci-fresh-only-failure-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-fresh-only-failure-evidence/
          if-no-files-found: warn
