name: Custodial v4.3 Backend Authority Inventory

on:
  push:
    branches:
      - agent/custodial-v43-backend-authority-inventory-20260807

permissions:
  contents: write

concurrency:
  group: custodial-v43-backend-authority-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[backend-authority-inventory-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout inventory branch with exact source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/custodial-v43-backend-authority-inventory-20260807

      - name: Verify frozen backend source
        shell: bash
        run: |
          test "$(git rev-parse 0fff8c2cadea132902df22c99593f1ce348411a7^{commit})" = "0fff8c2cadea132902df22c99593f1ce348411a7"
          git merge-base --is-ancestor 0fff8c2cadea132902df22c99593f1ce348411a7 HEAD

      - name: Generate exact source-bound inventory
        shell: bash
        run: |
          python3 scripts/generate-custodial-v43-backend-authority-inventory.py \
            --commit 0fff8c2cadea132902df22c99593f1ce348411a7 \
            --repository lasrevinu333-design/memphis-zoo-mcp \
            --output docs/architecture-evidence/custodial-v43-backend-authority-inventory.json \
            | tee /tmp/backend-authority-inventory-result.json

      - name: Independent output shape and no-placeholder checks
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/architecture-evidence/custodial-v43-backend-authority-inventory.json')
          d=json.loads(p.read_text())
          assert d['source_commit']=='0fff8c2cadea132902df22c99593f1ce348411a7'
          assert d['status']=='SOURCE_INVENTORY_COMPLETE_DISPOSITIONS_PENDING_ARCHITECTURE_REVIEW'
          assert d['acceptance']['downstream_authority'] is False
          assert d['summary']['entries'] == len(d['entries'])
          assert len({x['id'] for x in d['entries']}) == len(d['entries'])
          for x in d['entries']:
              assert x['path'] and x['line'] > 0 and x['file_sha256'] and x['source_commit']
              assert x['symbol'] and x['category']
              assert x['target_disposition'] != 'ADMITTED'
          assert all(x['pass'] for x in d['core_pattern_coverage'].values())
          assert all(x['pass'] for x in d['minimum_coverage'].values())
          print(json.dumps({'status':'PASS','entries':len(d['entries']),'inventory_sha256':d['inventory_sha256']},sort_keys=True))
          PY

      - name: Commit evidence and retire one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/custodial-v43-backend-authority-inventory.yml .inventory-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-custodial-v43-backend-authority-inventory.py \
                  docs/architecture-evidence/custodial-v43-backend-authority-inventory.json \
                  .github/workflows/custodial-v43-backend-authority-inventory.yml \
                  .inventory-trigger
          git commit -m "Generate exact backend authority inventory [backend-authority-inventory-generated]"
          git push origin HEAD:agent/custodial-v43-backend-authority-inventory-20260807

      - name: Upload inventory execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custodial-v43-backend-authority-inventory-evidence
          path: /tmp/backend-authority-inventory-result.json
          if-no-files-found: warn
          retention-days: 14
