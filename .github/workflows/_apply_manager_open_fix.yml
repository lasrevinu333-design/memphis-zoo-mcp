name: Apply Open Manager Hub Fix

on:
  push:
    branches:
      - fix/open-manager-hubs-20260715
    paths:
      - .github/workflows/_apply_manager_open_fix.yml

permissions:
  contents: write

concurrency:
  group: open-manager-hub-backend-20260715
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lasrevinu333-design/Engine
          ref: fix/open-manager-hubs-20260715
          path: _engine_fixture
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and apply audited source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/manager-open-payload/chunk_* | base64 --decode > /tmp/manager-open-backend.tar.gz
          printf '%s  %s\n' '35215b93fa906754008c9994f3c9d83bec57aa094529d24eac5c2a5b7666707f' /tmp/manager-open-backend.tar.gz | sha256sum --check
          tar -xzf /tmp/manager-open-backend.tar.gz -C .
          git diff --check

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run manager-auth foundation gate
        shell: bash
        env:
          ENGINE_FIXTURE_ROOT: ${{ github.workspace }}/_engine_fixture
        run: |
          set -euo pipefail
          node scripts/manager-open-session-foundation-tests.mjs
          node scripts/shared-access-auth-tests.mjs
          node --check src/auth/shared-access-auth.js
          node --check src/app-version.js
          node --check scripts/manager-open-session-foundation-tests.mjs
          node --check scripts/shared-access-auth-tests.mjs

      - name: Commit only tested application source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _engine_fixture .repair
          rm -f .github/workflows/_apply_manager_open_fix.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Open manager hubs without passwords; retain Gemini and Moxie auth'
          git push origin "HEAD:${GITHUB_REF_NAME}"
