name: Validate canonical device alias precedence

on:
  push:
    branches:
      - fix/device-alias-precedence-20260714
    paths:
      - .github/workflows/_validate_device_alias_precedence.yml

permissions:
  contents: write

concurrency:
  group: device-alias-precedence-20260714
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run identity and affected regression gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/device-identity.js
          node --check scripts/scheduler-alerts-gps-foundation-tests.mjs
          npm run --silent test:foundation
          npm run --silent test:auth
          npm run --silent test:messaging
          npm run --silent test:leadership-demo
          npm audit --omit=dev --audit-level=high

      - name: Publish clean tested source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_validate_device_alias_precedence.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize canonical device alias precedence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
