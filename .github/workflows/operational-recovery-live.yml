name: Manager Access, Moxie, and Operational Live Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: manager-access-moxie-operational-live-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify deployed manager-access repair and operational contracts
        shell: bash
        run: |
          set -euo pipefail
          root='https://memphis-zoo-mcp.onrender.com'
          # The version manifest and every operational health response expose
          # the immutable deployed Git SHA separately from the semantic
          # release ID. This lets the gate prove that rolling Render traffic
          # has converged without conflating source identity and app version.
          expected_sha="${GITHUB_SHA}"
          version=''
          moxie_health=''
          for attempt in $(seq 1 60); do
            version="$(curl -fsSL --max-time 40 "$root/version?attempt=$attempt" || true)"
            moxie_health="$(curl -fsSL --max-time 40 "$root/moxie/health?attempt=$attempt" || true)"
            printf 'attempt=%s version=%s moxie_health=%s\n' "$attempt" "$version" "$moxie_health"
            if grep -Fq "$expected_sha" <<<"$version" && grep -Fq '"auth_required":true' <<<"$moxie_health"; then break; fi
            sleep 10
          done
          grep -Fq "$expected_sha" <<<"$version"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True and d["configured"] is True and d["auth_required"] is True' <<<"$moxie_health"

          # The browser/app origin boundary is checked before trusted-device
          # authority. Exercise the intended unauthenticated state from the
          # approved production origin; a missing origin must remain 403.
          auth_status="$(curl -sS --max-time 40 -o /tmp/passwordless-manager-auth.json -w '%{http_code}' \
            -H 'Origin: https://memphis-zoo-mcp.onrender.com' \
            -H 'X-Device-Id: live-manager-access-verifier' \
            "$root/auth-api/session?access_level=full_access")"
          test "$auth_status" = '401'
          grep -Eiq 'manager|auth|denied|unauthorized|password' /tmp/passwordless-manager-auth.json

          # Render can briefly route consecutive requests to different
          # revisions during a rolling deployment. Require every health
          # endpoint to converge on this commit before enforcing the result.
          operational_endpoints=(/scan-api/health /schedule-api/health /messaging-api/health /dashboard-api/health)
          all_endpoints_current=false
          for rollout_attempt in $(seq 1 60); do
            all_endpoints_current=true
            for endpoint in "${operational_endpoints[@]}"; do
              body="$(curl -fsSL --max-time 40 "$root$endpoint?rollout_attempt=$rollout_attempt" || true)"
              printf 'rollout_attempt=%s %s %s\n' "$rollout_attempt" "$endpoint" "$body"
              if ! grep -Fq '"ok":true' <<<"$body" || ! grep -Fq "\"backend_commit_sha\":\"$expected_sha\"" <<<"$body"; then
                all_endpoints_current=false
              fi
            done
            if [ "$all_endpoints_current" = true ]; then break; fi
            sleep 10
          done
          test "$all_endpoints_current" = true

          dependencies="$(curl -fsSL --max-time 40 "$root/health/dependencies")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True and d["database_reachable"] is True and d["required_schema_present"] is True and d["worker"]["durable_database_leases"] is True' <<<"$dependencies"

          root_status="$(curl -sS --max-time 40 -D /tmp/moxie-root.headers -o /tmp/moxie-root.body -w '%{http_code}' "$root/moxie/")"
          tr -d '\r' < /tmp/moxie-root.headers > /tmp/moxie-root.normalized
          cat /tmp/moxie-root.normalized
          case "$root_status" in 302|303) ;; *) echo "Unexpected Moxie root status: $root_status"; exit 1 ;; esac
          grep -Fqi 'location: /moxie/login' /tmp/moxie-root.normalized
          grep -Eiq '^cache-control: .*no-store' /tmp/moxie-root.normalized

          login_status="$(curl -sS --max-time 40 -D /tmp/moxie-login.headers -o /tmp/moxie-login.html -w '%{http_code}' "$root/moxie/login")"
          test "$login_status" = '200'
          grep -Fq 'type="password"' /tmp/moxie-login.html
          grep -Fq 'id="moxie-secret-entry"' /tmp/moxie-login.html
          grep -Fq 'value=""' /tmp/moxie-login.html
          grep -Fq 'autocomplete="new-password"' /tmp/moxie-login.html
          grep -Fq 'readonly' /tmp/moxie-login.html
          grep -Fq 'data-lpignore="true"' /tmp/moxie-login.html
          grep -Fq 'data-1p-ignore="true"' /tmp/moxie-login.html
          grep -Fq 'id="moxie-secret-submit" name="password" value=""' /tmp/moxie-login.html

          wrong="invalid-live-probe-$(date +%s)"
          wrong_status="$(curl -sS --max-time 40 -D /tmp/moxie-wrong.headers -o /tmp/moxie-wrong.html -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "password=$wrong" \
            "$root/moxie/login")"
          test "$wrong_status" = '401'
          grep -Fqi 'Wrong password' /tmp/moxie-wrong.html
          ! grep -Eiq '^set-cookie: moxie_session=[^;]+' /tmp/moxie-wrong.headers

          logout_status="$(curl -sS --max-time 40 -D /tmp/moxie-logout.headers -o /tmp/moxie-logout.body -w '%{http_code}' "$root/moxie/logout")"
          tr -d '\r' < /tmp/moxie-logout.headers > /tmp/moxie-logout.normalized
          test "$logout_status" = '303'
          grep -Fqi 'location: /moxie/login?logged_out=1' /tmp/moxie-logout.normalized
          grep -Eiq '^set-cookie: moxie_session=' /tmp/moxie-logout.normalized
          grep -Eiq 'path=/moxie' /tmp/moxie-logout.normalized
          grep -Eiq 'max-age=0|expires=Thu, 01 Jan 1970' /tmp/moxie-logout.normalized

          signed_out_status="$(curl -sS --max-time 40 -o /tmp/moxie-signed-out.html -w '%{http_code}' "$root/moxie/login?logged_out=1")"
          test "$signed_out_status" = '200'
          grep -Fq 'Signed out. Enter the password to open Moxie again.' /tmp/moxie-signed-out.html

          for asset in moxie-avatar.jpg frog-on-log-writing-pad.png reminders-woodland-animal.png contacts-creekside-animal.png settings-woodland-cog.png ops-dashboard.png ops-schedule.png ops-events.png ops-messaging.png; do
            status="$(curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 40 -D "/tmp/$asset.headers" -o "/tmp/$asset" -w '%{http_code}' "$root/moxie/assets/$asset")"
            bytes="$(wc -c < "/tmp/$asset" | tr -d ' ')"
            printf '%s status=%s bytes=%s\n' "$asset" "$status" "$bytes"
            test "$status" = '200'
            grep -Eiq '^content-type: image/' "/tmp/$asset.headers"
            test "$bytes" -gt 500
            test "$bytes" -lt 400000
          done

          # A caller-supplied kiosk label is not employee authority. The live
          # gate cannot possess or copy a phone's reusable native credential,
          # so it proves the external negative boundary and leaves successful
          # credentialed access to the native/device and physical-canary gates.
          device_status_code="$(curl -sS --max-time 40 -o /tmp/kiosk-device-status.json -w '%{http_code}' \
            -H 'X-Device-Id: KIOSK_02' \
            "$root/device-auth/status?device_id=KIOSK_02")"
          case "$device_status_code" in 401|403) ;; *) echo "Identifier-only device status was not denied: $device_status_code"; exit 1 ;; esac
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is False and d["code"] in {"device_not_registered","device_not_eligible","device_credential_required"}' </tmp/kiosk-device-status.json

          for device in KIOSK_02 KIOSK_03 KIOSK_04 KIOSK_05 KIOSK_06 KIOSK_07 KIOSK_08 KIOSK_09 KIOSK_10; do
            schedule_status="$(curl -sS --max-time 40 -o "/tmp/$device-schedule.json" -w '%{http_code}' \
              -H "X-Device-Id: $device" \
              "$root/schedule-api/my-day-summary?device_id=$device")"
            printf '%s identifier_only_schedule_status=%s\n' "$device" "$schedule_status"
            case "$schedule_status" in 401|403) ;; *) echo "Identifier-only schedule access was not denied for $device: $schedule_status"; exit 1 ;; esac
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is False and d["code"] in {"device_not_registered","device_not_eligible","device_credential_required"}' <"/tmp/$device-schedule.json"
          done

          echo MANAGER_ACCESS_MOXIE_OPERATIONAL_LIVE_PASS
