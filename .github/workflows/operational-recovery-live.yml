name: Manager Access and Operational Live Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: manager-access-operational-live-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify deployed manager-access repair and operational contracts
        shell: bash
        run: |
          set -euo pipefail
          root='https://memphis-zoo-mcp.onrender.com'
          # The version manifest and every operational health response expose
          # the immutable deployed Git SHA separately from the semantic
          # release ID. This lets the gate prove that rolling Render traffic
          # has converged without conflating source identity and app version.
          expected_sha="${GITHUB_SHA}"
          version=''
          leadership_health=''
          for attempt in $(seq 1 60); do
            version="$(curl -fsSL --max-time 40 "$root/version?attempt=$attempt" || true)"
            leadership_health="$(curl -fsSL --max-time 40 "$root/leadership-api/health?attempt=$attempt" || true)"
            printf 'attempt=%s version=%s leadership_health=%s\n' "$attempt" "$version" "$leadership_health"
            if grep -Fq "$expected_sha" <<<"$version" && grep -Fq '"named_manager_enrollment":true' <<<"$leadership_health"; then break; fi
            sleep 10
          done
          grep -Fq "$expected_sha" <<<"$version"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True and d["named_manager_enrollment"] is True and d["shared_manager_enrollment"] is False' <<<"$leadership_health"

          # The browser/app origin boundary is checked before trusted-device
          # authority. Exercise the intended unauthenticated state from the
          # approved production origin; a missing origin must remain 403.
          auth_status="$(curl -sS --max-time 40 -o /tmp/passwordless-manager-auth.json -w '%{http_code}' \
            -H 'Origin: https://memphis-zoo-mcp.onrender.com' \
            -H 'X-Device-Id: live-manager-access-verifier' \
            "$root/auth-api/session?access_level=full_access")"
          test "$auth_status" = '401'
          grep -Eiq 'manager|auth|denied|unauthorized|password' /tmp/passwordless-manager-auth.json

          # Render can briefly route consecutive requests to different
          # revisions during a rolling deployment. Require every health
          # endpoint to converge on this commit before enforcing the result.
          operational_endpoints=(/scan-api/health /schedule-api/health /messaging-api/health /dashboard-api/health)
          all_endpoints_current=false
          for rollout_attempt in $(seq 1 60); do
            all_endpoints_current=true
            for endpoint in "${operational_endpoints[@]}"; do
              body="$(curl -fsSL --max-time 40 "$root$endpoint?rollout_attempt=$rollout_attempt" || true)"
              printf 'rollout_attempt=%s %s %s\n' "$rollout_attempt" "$endpoint" "$body"
              if ! grep -Fq '"ok":true' <<<"$body" || ! grep -Fq "\"backend_commit_sha\":\"$expected_sha\"" <<<"$body"; then
                all_endpoints_current=false
              fi
            done
            if [ "$all_endpoints_current" = true ]; then break; fi
            sleep 10
          done
          test "$all_endpoints_current" = true

          dependencies="$(curl -fsSL --max-time 40 "$root/health/dependencies")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True and d["database_reachable"] is True and d["required_schema_present"] is True and d["worker"]["durable_database_leases"] is True' <<<"$dependencies"

          # The retired MOXIE web/mobile routes must not reappear. The legacy
          # OAuth environment-variable name is a separate credential boundary.
          for retired_path in /moxie/ /moxie/login /moxie/health /moxie-mobile-api/health; do
            retired_status="$(curl -sS --max-time 40 -o /dev/null -w '%{http_code}' "$root$retired_path")"
            printf 'retired_path=%s status=%s\n' "$retired_path" "$retired_status"
            test "$retired_status" = '404'
          done

          # The enrollment-status preflight may tell a phone that enrollment or
          # recovery is required, but a caller-supplied kiosk label must never
          # disclose employee, device, or reusable credential identity. The
          # employee Schedule probe below remains the actual authority boundary.
          device_status_code="$(curl -sS --max-time 40 -o /tmp/kiosk-device-status.json -w '%{http_code}' \
            -H 'X-Device-Id: KIOSK_02' \
            "$root/device-auth/status?device_id=KIOSK_02")"
          test "$device_status_code" = '200'
          python3 -c 'import json,sys; d=json.load(sys.stdin); x=d["data"]; assert d["ok"] is True and x["authenticated"] is False and x["employee_name"] is None and x["device_name"] is None and x["credential_id"] is None' </tmp/kiosk-device-status.json \
            || { echo "Identifier-only device status exposed employee authority"; exit 1; }

          for device in KIOSK_02 KIOSK_03 KIOSK_04 KIOSK_05 KIOSK_06 KIOSK_07 KIOSK_08 KIOSK_09 KIOSK_10; do
            schedule_status="$(curl -sS --max-time 40 -o "/tmp/$device-schedule.json" -w '%{http_code}' \
              -H "X-Device-Id: $device" \
              "$root/schedule-api/my-day-summary?device_id=$device")"
            printf '%s identifier_only_schedule_status=%s\n' "$device" "$schedule_status"
            case "$schedule_status" in 401|403) ;; *) echo "Identifier-only schedule access was not denied for $device: $schedule_status"; exit 1 ;; esac
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is False and d["code"] in {"device_not_registered","device_not_eligible","device_credential_required"}' <"/tmp/$device-schedule.json"
          done

          echo MANAGER_ACCESS_OPERATIONAL_LIVE_PASS
