name: Custodial Production Repair Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/custodial-foundation-repair-20260717

permissions:
  contents: read

concurrency:
  group: custodial-production-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Reviewed phone, pair, and isolated recorder regressions
        shell: /usr/bin/env -i HOME=/home/runner PATH=/opt/hostedtoolcache/node/22.23.4/x64/bin:/usr/bin:/bin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          docker pull supabase/postgres@sha256:fbf77524fc188126c1775fd2d2e54040bde295438a3e6f07936f3c39e6f688ed
          /usr/bin/sha256sum --check --strict <<'REVIEWED_INPUTS'
          d0338487e0dede546f5ef9b27f165bdb5f99739d7ed61aee32e82b453300e630  package.json
          712cbdf47ce9920d45d10c87cf658e0f3ea7c321e7f933647efa4dbb030bb5bb  package-lock.json
          d8ad584e8dd3adf8be9aa04bf7287fb45ed8805f7d771c814183cc781e8e2149  scripts/legacy-activation-http-tests.mjs
          b2fe3d3dd2c1b7619d5cb7869a865ef44284269264cd6e0f931cdbbf930141d0  scripts/release-pair-consumer-regression-tests.mjs
          9c330f91a9795187cbfb1edb92f2283b121935b609169e33effdb07f52e88e12  scripts/run-isolated-release-recorder-tests.mjs
          c2b5f2f3324cd7615844cfb3c458c4e1febc11ce7e8c4f05368567fce1e64cfe  scripts/production-release-recorder-database-tests.mjs
          6a0c4211cedb1379501769b6944c4821762a4015cb00dca09f40fe1f647a1329  scripts/fixtures/exact-frontend-pair.mjs
          REVIEWED_INPUTS
          /opt/hostedtoolcache/node/22.23.4/x64/bin/node scripts/legacy-activation-http-tests.mjs && /opt/hostedtoolcache/node/22.23.4/x64/bin/node scripts/release-pair-consumer-regression-tests.mjs && /opt/hostedtoolcache/node/22.23.4/x64/bin/node scripts/run-isolated-release-recorder-tests.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Source contract and unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent test:events-parser
          npm run --silent test:events-api
          npm run --silent test:event-integrity
          npm run --silent test:batch2
          npm run --silent test:operational-analytics
          npm run --silent test:audit4-repairs
          npm run --silent test:audit5-repairs
          npm run --silent test:audit6-repairs
          npm run --silent test:feedback
          npm run --silent test:schedule-ai
          npm run --silent test:ai-intent
          npm run --silent test:messaging
          npm run --silent test:auth
          npm run --silent test:dashboard
          npm run --silent test:scheduler-overhaul
          npm run --silent test:sch2-publish
          npm run --silent test:foundation
          npm run --silent test:schedule-display
          npm run --silent test:messaging-recovery
          npm run --silent test:messaging-incremental
          npm run --silent test:messaging-manager-authority
          npm run --silent test:moxie-route
          npm run --silent test:schedule-source-type
          npm run --silent test:device-credentials
          npm run --silent test:operational-recovery
          npm run --silent test:foundation-repair
          npm run --silent test:custodial-repair
          npm run --silent test:custodial-employee-phones
          npm run --silent test:custodial-enrollment-security
          npm run --silent test:custodial-device-removal
          npm run --silent test:employee-notifications
          npm run --silent test:phone-readiness
          npm run --silent test:device-security-app
          npm run --silent test:gemini-console
          npm run --silent test:schema-fingerprint
          npm run --silent test:schema-transition
          npm run --silent test:production-schema-inspection-freshness
          npm run --silent test:ci-workflows
          npm run --silent test:isolated-restore-lease-shim
      - name: Empty database migration rebuild and database concurrency
        shell: bash
        env:
          SCHEMA_REBUILD_DOCKER_IMAGE: public.ecr.aws/supabase/postgres@sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518
          SCHEMA_REBUILD_FRESH_ONLY: '1'
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d /tmp/custodial-repair-fresh.XXXXXX)"
          chmod 700 "$fixture_root"
          export TMPDIR="$fixture_root"
          fixture_owner() {
            node --max-old-space-size=128 --input-type=module - "$fixture_root" "$1" "$2" <<'FIXTURE_OWNER'
          import assert from 'node:assert/strict';
          import {lstatSync,realpathSync,readdirSync,readFileSync,existsSync} from 'node:fs';
          import {resolve,basename} from 'node:path';
          import {assertCiFreshOnlyRetainedFixture} from './scripts/ci-fresh-only-replay.mjs';
          const [directory,mode,alias]=process.argv.slice(2);
          assert.ok(['false','true'].includes(mode));assert.equal(resolve(directory),directory);assert.equal(realpathSync(directory),directory);
          assert.equal(resolve(directory,'..'),'/tmp');assert.match(basename(directory),/^custodial-repair-fresh\.[A-Za-z0-9]+$/);
          const st=lstatSync(directory);assert.ok(st.isDirectory()&&!st.isSymbolicLink());assert.equal(st.uid,process.getuid());assert.equal(st.mode&0o777,0o700);
          const children=readdirSync(directory).filter(n=>n.startsWith('custodial-ci-fresh-custody-'));
          assert.ok(children.length<=1,'Ambiguous original private custody');
          if(!children.length){assert.equal(mode,'true','No completed owned fixture');console.log('FRESH_FIXTURE_PREBIRTH_NO_CONTAINER');}
          else{
           const custodyDirectory=resolve(directory,children[0]),cs=lstatSync(custodyDirectory);
           assert.ok(cs.isDirectory()&&!cs.isSymbolicLink());assert.equal(cs.uid,process.getuid());assert.equal(cs.mode&0o777,0o700);assert.equal(realpathSync(custodyDirectory),custodyDirectory);
           const read=n=>{const p=resolve(custodyDirectory,n),s=lstatSync(p);assert.ok(s.isFile()&&!s.isSymbolicLink());assert.equal(s.uid,process.getuid());assert.equal(s.nlink,1);assert.ok(s.size<1048576);return readFileSync(p,'utf8');};
           const birth=JSON.parse(read('PREBIRTH_ORIGINAL_CONTAINER.json'));assert.equal(birth.directory,custodyDirectory);assert.match(birth.name,/^mz_schema_rebuild_[A-Za-z0-9_]+$/);
           const container=existsSync(resolve(custodyDirectory,'original-container.cid'))?read('original-container.cid').trim():null;
           if(container!==null)assert.match(container,/^[a-f0-9]{64}$/);if(alias)assert.equal(alias,birth.name,'Child name alias differs from original owner');
           await assertCiFreshOnlyRetainedFixture({name:birth.name,container,custodyDirectory,remove:mode==='true'});
          }
          FIXTURE_OWNER
          }
          cleanup_original_database() {
            result=$?
            trap - EXIT
            set +e
            fixture_owner true ""
            cleanup_result=$?
            if (( cleanup_result != 0 )); then result=74; fi
            exit "$result"
          }
          trap cleanup_original_database EXIT
          export SCHEMA_REBUILD_KEEP_DATABASE=1
          npm run --silent test:empty-db-rebuild | tee "$fixture_root/rebuild.log"
          container="$(sed -n 's/.*"retained_test_container":"\([^"]*\)".*/\1/p' "$fixture_root/rebuild.log" | tail -n 1)"
          test -n "$container"
          fixture_owner false "$container"
          OPERATIONS_LEADERSHIP_TEST_DOCKER_CONTAINER="$container" \
            OPERATIONS_LEADERSHIP_TEST_DATABASE=postgres \
            npm run --silent test:operations-leadership-mobile-db
          CUSTODIAL_PHONE_TEST_DOCKER_CONTAINER="$container" \
            CUSTODIAL_PHONE_TEST_DATABASE=postgres \
            npm run --silent test:custodial-employee-phones-db
          CUSTODIAL_ENROLLMENT_TEST_DOCKER_CONTAINER="$container" \
            CUSTODIAL_ENROLLMENT_TEST_DATABASE=postgres \
            npm run --silent test:custodial-enrollment-security-db
          CUSTODIAL_REMOVAL_TEST_DOCKER_CONTAINER="$container" \
            CUSTODIAL_REMOVAL_TEST_DATABASE=postgres \
            npm run --silent test:custodial-device-removal-db
          CUSTODIAL_ATOMIC_COMMIT_TEST_DOCKER_CONTAINER="$container" \
            CUSTODIAL_ATOMIC_COMMIT_TEST_DATABASE=postgres \
            npm run --silent test:custodial-atomic-commit-db
          SCHEMA_RECONCILIATION_TEST_DOCKER_CONTAINER="$container" \
            SCHEMA_RECONCILIATION_TEST_DATABASE=postgres \
            npm run --silent test:schema-reconciliation-db
          GEMINI_CONSOLE_TEST_DOCKER_CONTAINER="$container" \
            GEMINI_CONSOLE_TEST_DATABASE=postgres \
            npm run --silent test:gemini-console-db
          EVENT_INTEGRITY_TEST_DOCKER_CONTAINER="$container" \
            EVENT_INTEGRITY_TEST_DATABASE=postgres \
            npm run --silent test:event-integrity-db
          BATCH2_TEST_DOCKER_CONTAINER="$container" \
            BATCH2_TEST_DATABASE=postgres \
            npm run --silent test:batch2-db
          OPERATIONAL_ANALYTICS_TEST_DOCKER_CONTAINER="$container" \
            OPERATIONAL_ANALYTICS_TEST_DATABASE=postgres \
            npm run --silent test:operational-analytics-db
          CUSTODIAL_STATIC_TRUTH_TEST_DOCKER_CONTAINER="$container" \
            CUSTODIAL_STATIC_TRUTH_TEST_DATABASE=postgres \
            npm run --silent test:static-weekly-operational-truth-db
          CLEANING_IDENTITY_TEST_DOCKER_CONTAINER="$container" \
            CLEANING_IDENTITY_TEST_DATABASE=postgres \
            npm run --silent test:cleaning-identity-gps-db
          RELEASE_CANARY_TEST_DOCKER_CONTAINER="$container" \
            RELEASE_CANARY_TEST_DATABASE=postgres \
            npm run --silent test:release-canary-recovery-db
          FINAL_UNCERTAINTY_TEST_DOCKER_CONTAINER="$container" \
            FINAL_UNCERTAINTY_TEST_DATABASE=postgres \
            npm run --silent test:final-uncertainty-closure-db
          npm run --silent test:release-closure
          fixture_owner false "$container"
      - name: Isolated current weekly event authority
        shell: bash
        env:
          SCHEMA_REBUILD_DOCKER_IMAGE: public.ecr.aws/supabase/postgres@sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518
          SCHEMA_REBUILD_FRESH_ONLY: '1'
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d /tmp/custodial-repair-fresh.XXXXXX)"
          chmod 700 "$fixture_root"
          export TMPDIR="$fixture_root"
          fixture_owner() {
            node --max-old-space-size=128 --input-type=module - "$fixture_root" "$1" "$2" <<'FIXTURE_OWNER'
          import assert from 'node:assert/strict';
          import {lstatSync,realpathSync,readdirSync,readFileSync,existsSync} from 'node:fs';
          import {resolve,basename} from 'node:path';
          import {assertCiFreshOnlyRetainedFixture} from './scripts/ci-fresh-only-replay.mjs';
          const [directory,mode,alias]=process.argv.slice(2);
          assert.ok(['false','true'].includes(mode));assert.equal(resolve(directory),directory);assert.equal(realpathSync(directory),directory);
          assert.equal(resolve(directory,'..'),'/tmp');assert.match(basename(directory),/^custodial-repair-fresh\.[A-Za-z0-9]+$/);
          const st=lstatSync(directory);assert.ok(st.isDirectory()&&!st.isSymbolicLink());assert.equal(st.uid,process.getuid());assert.equal(st.mode&0o777,0o700);
          const children=readdirSync(directory).filter(n=>n.startsWith('custodial-ci-fresh-custody-'));
          assert.ok(children.length<=1,'Ambiguous original private custody');
          if(!children.length){assert.equal(mode,'true','No completed owned fixture');console.log('FRESH_FIXTURE_PREBIRTH_NO_CONTAINER');}
          else{
           const custodyDirectory=resolve(directory,children[0]),cs=lstatSync(custodyDirectory);
           assert.ok(cs.isDirectory()&&!cs.isSymbolicLink());assert.equal(cs.uid,process.getuid());assert.equal(cs.mode&0o777,0o700);assert.equal(realpathSync(custodyDirectory),custodyDirectory);
           const read=n=>{const p=resolve(custodyDirectory,n),s=lstatSync(p);assert.ok(s.isFile()&&!s.isSymbolicLink());assert.equal(s.uid,process.getuid());assert.equal(s.nlink,1);assert.ok(s.size<1048576);return readFileSync(p,'utf8');};
           const birth=JSON.parse(read('PREBIRTH_ORIGINAL_CONTAINER.json'));assert.equal(birth.directory,custodyDirectory);assert.match(birth.name,/^mz_schema_rebuild_[A-Za-z0-9_]+$/);
           const container=existsSync(resolve(custodyDirectory,'original-container.cid'))?read('original-container.cid').trim():null;
           if(container!==null)assert.match(container,/^[a-f0-9]{64}$/);if(alias)assert.equal(alias,birth.name,'Child name alias differs from original owner');
           await assertCiFreshOnlyRetainedFixture({name:birth.name,container,custodyDirectory,remove:mode==='true'});
          }
          FIXTURE_OWNER
          }
          cleanup_event_database() {
            result=$?
            trap - EXIT
            set +e
            fixture_owner true ""
            cleanup_result=$?
            if (( cleanup_result != 0 )); then result=74; fi
            exit "$result"
          }
          trap cleanup_event_database EXIT
          event_log="$fixture_root/rebuild.log"
          SCHEMA_REBUILD_KEEP_DATABASE=1 npm run --silent test:empty-db-rebuild | tee "$event_log"
          mapfile -t retained < <(sed -n 's/.*"retained_test_container":"\(mz_schema_rebuild_[A-Za-z0-9_]*\)".*/\1/p' "$event_log" | sort -u)
          test "${#retained[@]}" -eq 1
          container="$(sed -n 's/.*"retained_test_container":"\([^"]*\)".*/\1/p' "$event_log" | tail -n 1)"
          test -n "$container"
          fixture_owner false "$container"
          EVENT_STATIC_AUTHORITY_TEST_DOCKER_CONTAINER="${retained[0]}" \
            EVENT_STATIC_AUTHORITY_TEST_DATABASE=postgres \
            npm run --silent test:event-static-authority-db
          fixture_owner false "$container"
