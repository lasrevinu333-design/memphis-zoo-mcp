name: Apply Named Messenger Rebuild Assertions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/empty-db-named-identities.patch.gz.b64'
      - '.github/workflows/apply-empty-db-named-identities-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply named identity rebuild patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .batch/empty-db-named-identities.patch.gz.b64 | gzip -dc > /tmp/empty-db-named-identities.patch
          patch -p1 --forward --batch < /tmp/empty-db-named-identities.patch
          git checkout HEAD -- .github/workflows/apply-empty-db-named-identities-fix.yml
          rm -f .batch/empty-db-named-identities.patch.gz.b64
          rmdir .batch 2>/dev/null || true
          node --check scripts/empty-database-rebuild-check.mjs
          git diff --check
      - name: Commit rebuild assertion update
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/empty-database-rebuild-check.mjs .batch
          git commit -m 'test: validate distinct named manager Messenger identities'
          git push origin HEAD:"$HEAD_BRANCH"
