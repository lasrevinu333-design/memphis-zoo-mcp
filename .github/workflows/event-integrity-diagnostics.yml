name: Event Integrity Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-integrity-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Run source contract
        shell: bash
        run: |
          set +e
          mkdir -p event-integrity-evidence
          {
            source_status=0
            npm run --silent test:event-integrity || source_status=$?
            npm run --silent test:batch2 || { status=$?; if [[ "$source_status" = "0" ]]; then source_status=$status; fi; }
            exit "$source_status"
          } 2>&1 | tee event-integrity-evidence/source.log
          source_pipe_status=("${PIPESTATUS[@]}")
          source_status=${source_pipe_status[0]}
          if [[ "$source_status" = "0" ]]; then source_status=${source_pipe_status[1]}; fi
          printf '%s\n' "$source_status" > event-integrity-evidence/source-status.txt
      - name: Rebuild database and run event integrity acceptance
        shell: bash
        env:
          SCHEMA_REBUILD_FRESH_ONLY: '1'
          SCHEMA_REBUILD_DOCKER_IMAGE: public.ecr.aws/supabase/postgres@sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518
        run: |
          set +e
          export SCHEMA_REBUILD_KEEP_DATABASE=1
          npm run --silent test:empty-db-rebuild 2>&1 | tee event-integrity-evidence/schema-rebuild.log
          rebuild_pipe_status=("${PIPESTATUS[@]}")
          rebuild_status=${rebuild_pipe_status[0]}
          if [[ "$rebuild_status" = "0" ]]; then rebuild_status=${rebuild_pipe_status[1]}; fi
          printf '%s\n' "$rebuild_status" > event-integrity-evidence/rebuild-status.txt
          if [[ "$rebuild_status" = "0" ]]; then
            container="$(sed -n 's/.*"retained_test_container":"\([^"]*\)".*/\1/p' event-integrity-evidence/schema-rebuild.log | tail -n 1)"
            if [[ -n "$container" ]]; then
              {
                database_status=0
                EVENT_INTEGRITY_TEST_DOCKER_CONTAINER="$container" \
                  EVENT_INTEGRITY_TEST_DATABASE=postgres \
                  npm run --silent test:event-integrity-db || database_status=$?
                BATCH2_TEST_DOCKER_CONTAINER="$container" \
                  BATCH2_TEST_DATABASE=postgres \
                  npm run --silent test:batch2-db || { status=$?; if [[ "$database_status" = "0" ]]; then database_status=$status; fi; }
                exit "$database_status"
              } 2>&1 | tee event-integrity-evidence/database.log
              database_pipe_status=("${PIPESTATUS[@]}")
              database_status=${database_pipe_status[0]}
              if [[ "$database_status" = "0" ]]; then database_status=${database_pipe_status[1]}; fi
              printf '%s\n' "$database_status" > event-integrity-evidence/database-status.txt
              docker rm -f "$container" >/dev/null 2>&1 || true
            else
              printf 'retained container not found\n' | tee event-integrity-evidence/database.log
              printf '1\n' > event-integrity-evidence/database-status.txt
            fi
          else
            printf '1\n' > event-integrity-evidence/database-status.txt
          fi
          exit 0
      - name: Upload complete event integrity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: event-integrity-diagnostics
          path: event-integrity-evidence
          retention-days: 14
      - name: Enforce results
        shell: bash
        run: |
          test "$(cat event-integrity-evidence/source-status.txt)" = "0"
          test "$(cat event-integrity-evidence/rebuild-status.txt)" = "0"
          test "$(cat event-integrity-evidence/database-status.txt)" = "0"
