name: Production Availability Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enforce exact integrated pair and observed production schema
        env:
          BACKEND_RELEASE_MANIFEST_URL: ${{ secrets.MEMPHIS_BACKEND_RELEASE_MANIFEST_URL }}
          BACKEND_SCHEMA_IDENTITY_URL: ${{ secrets.MEMPHIS_BACKEND_SCHEMA_IDENTITY_URL }}
          FRONTEND_RELEASE_MANIFEST_URL: ${{ secrets.MEMPHIS_FRONTEND_RELEASE_MANIFEST_URL }}
          FRONTEND_DEPLOYMENT_MANIFEST_URL: ${{ secrets.MEMPHIS_FRONTEND_DEPLOYMENT_MANIFEST_URL }}
          LIVE_RELEASE_SCHEMA_IDENTITY_TOKEN: ${{ secrets.MEMPHIS_RELEASE_SCHEMA_IDENTITY_TOKEN }}
          MEMPHIS_RELEASE_ATTESTATION_JSON: ${{ secrets.MEMPHIS_RELEASE_ATTESTATION_JSON }}
          MEMPHIS_RELEASE_ATTESTATION_PUBLIC_KEY: ${{ secrets.MEMPHIS_RELEASE_ATTESTATION_PUBLIC_KEY }}
          STATIC_WEEKLY_CONTROL_PLANE_READY_URL: ${{ secrets.MEMPHIS_STATIC_WEEKLY_CONTROL_PLANE_READY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MEMPHIS_RELEASE_ATTESTATION_JSON"
          test -n "$MEMPHIS_RELEASE_ATTESTATION_PUBLIC_KEY"
          LIVE_RELEASE_ATTESTATION_INPUT=/tmp/memphis-live-release-attestation.json
          export LIVE_RELEASE_ATTESTATION_INPUT
          umask 077
          printf '%s' "$MEMPHIS_RELEASE_ATTESTATION_JSON" > "$LIVE_RELEASE_ATTESTATION_INPUT"
          chmod 0444 "$LIVE_RELEASE_ATTESTATION_INPUT"
          npm run --silent release:live:check
