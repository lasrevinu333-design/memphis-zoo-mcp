name: Production Availability Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce live dependency health and four-second response budget
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          backend='https://memphis-zoo-mcp.onrender.com'
          frontend='https://lasrevinu333-design.github.io/Engine'

          curl -fsSL --max-time 4 \
            -w '%{time_total}\n' \
            -o /tmp/health.json \
            "$backend/health?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > /tmp/backend-latency.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text())
          latency = float(Path('/tmp/backend-latency.txt').read_text().strip())
          assert health['ok'] is True, health
          assert health['database_reachable'] is True, health
          assert health['required_schema_present'] is True, health
          assert health['worker']['dead_letters'] == 0, health
          assert health['worker']['expired_leases'] == 0, health
          assert latency <= 4.0, f'backend health exceeded four seconds: {latency:.3f}s'
          print(f'backend_health_ok latency={latency:.3f}s')
          PY

          curl -fsSL --max-time 4 \
            -w '%{time_total}\n' \
            -o /tmp/version.json \
            "$backend/version?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > /tmp/version-latency.txt
          curl -fsSL --max-time 4 \
            -w '%{time_total}\n' \
            -o /tmp/frontend-manifest.json \
            "$frontend/frontend-release-manifest.json?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > /tmp/frontend-latency.txt
          curl -fsSL --max-time 4 \
            -w '%{time_total}\n' \
            -o /tmp/frontend-deployment.json \
            "$frontend/frontend-deployment-manifest.json?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > /tmp/frontend-deployment-latency.txt
          read -r baseline_frontend_commit deployed_frontend_commit < <(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          version = json.loads(Path('/tmp/version.json').read_text())
          deployment = json.loads(Path('/tmp/frontend-deployment.json').read_text())
          baseline = version['release_manifest']['frontend']['commit_sha']
          deployed = deployment['frontend_commit_sha']
          assert re.fullmatch(r'[a-f0-9]{40}', baseline), baseline
          assert re.fullmatch(r'[a-f0-9]{40}', deployed), deployed
          print(baseline, deployed)
          PY
          )
          if [[ "$baseline_frontend_commit" == "$deployed_frontend_commit" ]]; then
            printf '%s\n' '{"status":"identical"}' > /tmp/frontend-compare.json
          else
            curl -fsSL --retry 2 --max-time 15 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_API_TOKEN" \
              -o /tmp/frontend-compare.json \
              "https://api.github.com/repos/lasrevinu333-design/Engine/compare/${baseline_frontend_commit}...${deployed_frontend_commit}"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('/tmp/version.json').read_text())
          frontend = json.loads(Path('/tmp/frontend-manifest.json').read_text())
          deployment = json.loads(Path('/tmp/frontend-deployment.json').read_text())
          comparison = json.loads(Path('/tmp/frontend-compare.json').read_text())
          version_latency = float(Path('/tmp/version-latency.txt').read_text().strip())
          frontend_latency = float(Path('/tmp/frontend-latency.txt').read_text().strip())
          deployment_latency = float(Path('/tmp/frontend-deployment-latency.txt').read_text().strip())
          assert version['ok'] is True, version
          assert version['version'] == frontend['release_id'], (version, frontend)
          assert deployment['release_id'] == frontend['release_id'], (deployment, frontend)
          assert comparison['status'] in ('identical', 'ahead'), comparison
          assert version['release_manifest']['schema']['fingerprint'] == frontend['schema_fingerprint'], (version, frontend)
          assert deployment['schema_fingerprint'] == frontend['schema_fingerprint'], (deployment, frontend)
          assert version_latency <= 4.0, f'version exceeded four seconds: {version_latency:.3f}s'
          assert frontend_latency <= 4.0, f'frontend exceeded four seconds: {frontend_latency:.3f}s'
          assert deployment_latency <= 4.0, f'frontend deployment manifest exceeded four seconds: {deployment_latency:.3f}s'
          print(f'release_alignment_ok release={frontend["release_id"]} frontend_commit={deployment["frontend_commit_sha"]} backend={version_latency:.3f}s frontend={frontend_latency:.3f}s deployment={deployment_latency:.3f}s')
          PY
