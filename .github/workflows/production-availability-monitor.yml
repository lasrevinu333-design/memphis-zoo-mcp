name: Production Availability Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify observer diagnostic contract
        run: node scripts/release-monitor-contract-tests.mjs
      - name: Observe availability and enforce exact signed release authority
        id: live_probe
        env:
          BACKEND_RELEASE_MANIFEST_URL: ${{ secrets.MEMPHIS_BACKEND_RELEASE_MANIFEST_URL }}
          BACKEND_SCHEMA_IDENTITY_URL: ${{ secrets.MEMPHIS_BACKEND_SCHEMA_IDENTITY_URL }}
          FRONTEND_RELEASE_MANIFEST_URL: ${{ secrets.MEMPHIS_FRONTEND_RELEASE_MANIFEST_URL }}
          FRONTEND_DEPLOYMENT_MANIFEST_URL: ${{ secrets.MEMPHIS_FRONTEND_DEPLOYMENT_MANIFEST_URL }}
          LIVE_RELEASE_SCHEMA_IDENTITY_TOKEN: ${{ secrets.MEMPHIS_RELEASE_SCHEMA_IDENTITY_TOKEN }}
          MEMPHIS_RELEASE_ATTESTATION_JSON: ${{ vars.MEMPHIS_MONITOR_APP_ATTESTATION_JSON || secrets.MEMPHIS_RELEASE_ATTESTATION_JSON }}
          MEMPHIS_RELEASE_ATTESTATION_PUBLIC_KEY: ${{ vars.MEMPHIS_MONITOR_ATTESTATION_PUBLIC_KEY || secrets.MEMPHIS_RELEASE_ATTESTATION_PUBLIC_KEY }}
          LIVE_RELEASE_OBSERVATION_REPORT: ${{ runner.temp }}/memphis-release-observation.json
          MEMPHIS_STATIC_WEEKLY_RELEASE_ATTESTATION_JSON: ${{ vars.MEMPHIS_STATIC_WEEKLY_RELEASE_ATTESTATION_JSON }}
          STATIC_WEEKLY_CONTROL_PLANE_READY_URL: ${{ secrets.MEMPHIS_STATIC_WEEKLY_CONTROL_PLANE_READY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/memphis-release-observer.XXXXXX")"
          export LIVE_RELEASE_ATTESTATION_INPUT="$private_dir/application.json"
          printf '%s' "$MEMPHIS_RELEASE_ATTESTATION_JSON" > "$LIVE_RELEASE_ATTESTATION_INPUT"
          chmod 0444 "$LIVE_RELEASE_ATTESTATION_INPUT"
          if [[ -n "$MEMPHIS_STATIC_WEEKLY_RELEASE_ATTESTATION_JSON" ]]; then
            export STATIC_WEEKLY_RELEASE_ATTESTATION_INPUT="$private_dir/scheduler.json"
            printf '%s' "$MEMPHIS_STATIC_WEEKLY_RELEASE_ATTESTATION_JSON" > "$STATIC_WEEKLY_RELEASE_ATTESTATION_INPUT"
            chmod 0444 "$STATIC_WEEKLY_RELEASE_ATTESTATION_INPUT"
          fi
          npm run --silent release:live:check
      - name: Summarize the bounded release observation
        if: always() && steps.live_probe.outcome != 'skipped'
        env:
          LIVE_RELEASE_OBSERVATION_REPORT: ${{ runner.temp }}/memphis-release-observation.json
        run: |
          node --input-type=module <<'OBSERVATION_SUMMARY'
          import {appendFileSync,readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.LIVE_RELEASE_OBSERVATION_REPORT,'utf8'));
          const summary=['## Custodial release observation','',
            'Integrated release `'+report.integrated_release+'`',
            ...(report.failed_check?['Failed check `'+report.failed_check+'`']:[]),'',
            ...report.probes.map(item=>'- '+item.id+' · '+item.state+(item.http===null?'':' · HTTP '+item.http)+' · '+item.elapsed_ms+' ms')];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n');
          OBSERVATION_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.live_probe.outcome != 'skipped'
        with:
          name: custodial-release-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memphis-release-observation.json
          retention-days: 14
          if-no-files-found: error
