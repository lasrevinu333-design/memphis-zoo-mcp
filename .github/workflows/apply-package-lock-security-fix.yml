name: Apply Package Lock Security Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/package-lock-security.patch.gz.b64'
      - '.github/workflows/apply-package-lock-security-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply package-lock security patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .batch/package-lock-security.patch.gz.b64 | gzip -dc > /tmp/package-lock-security.patch
          patch -p1 --forward --batch < /tmp/package-lock-security.patch
          git checkout HEAD -- .github/workflows/apply-package-lock-security-fix.yml
          rm -f .batch/package-lock-security.patch.gz.b64
          rmdir .batch 2>/dev/null || true
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          git diff --check
      - name: Commit lock update
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .batch
          git commit -m 'chore: update audited dependency lock'
          git push origin HEAD:"$HEAD_BRANCH"
