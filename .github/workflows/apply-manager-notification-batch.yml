name: Apply Manager Notification Batch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/backend.*'
      - '.github/workflows/apply-manager-notification-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact audited batch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch/backend.* | base64 -d | gzip -dc > /tmp/manager-notification-batch.patch
          patch -p1 --forward --batch < /tmp/manager-notification-batch.patch
          rm -rf .batch
          rm -f .github/workflows/apply-manager-notification-batch.yml
          git diff --check
      - name: Commit batch to pull-request branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add manager notification preferences and delivery'
          git push origin HEAD:"$HEAD_BRANCH"
