name: Apply backend security control plane v2

on:
  push:
    branches:
      - foundation/security-control-plane-v2-20260715

permissions:
  contents: write

concurrency:
  group: apply-backend-security-control-plane-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: lasrevinu333-design/Engine
          ref: foundation/security-control-plane-v2-20260715
          path: Engine
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply exact audited patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64=.foundation/security_patch/backend.patch.gz.b64
          if [[ ! -f "$PATCH_B64" ]]; then
            echo 'Patch payload is not staged yet; nothing to apply.'
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(sha256sum "$PATCH_B64" | awk '{print $1}')" = '04376625a3cbcd205343ac1c3238091a10c372352ffd4fbf28554bf84cd01f6b'
          base64 -d "$PATCH_B64" | gzip -dc > /tmp/backend-security.patch
          test "$(sha256sum /tmp/backend-security.patch | awk '{print $1}')" = '9750e8907cf2137e268a75536dda5c8c829b832b579086833aa27a16cbb70600'
          git apply --check /tmp/backend-security.patch
          git apply /tmp/backend-security.patch
          rm -rf .foundation/security_patch
          rm -f .github/workflows/_apply_security_control_plane_v2.yml
          rm -f .github/workflows/bootstrap-auth-foundation.yml
          echo 'applied=true' >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate backend foundation
        shell: bash
        env:
          ENGINE_FIXTURE_ROOT: ${{ github.workspace }}/Engine
        run: |
          set -euo pipefail
          node --check src/auth/shared-access-auth.js
          node --check src/auth/mcp-connector-auth.js
          node --check src/index.js
          npm run --silent test:auth
          npm run --silent test:manager-open
          npm run --silent test:messaging
          npm run --silent smoke
      - name: Commit validated source
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Engine
          git add -A
          git config user.name 'foundation-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security: replace passwordless manager and MCP authentication'
          git push origin HEAD:${GITHUB_REF_NAME}
