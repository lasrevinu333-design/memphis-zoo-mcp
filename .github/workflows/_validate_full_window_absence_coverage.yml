name: Validate full-window absence coverage

on:
  push:
    branches:
      - fix/full-window-absence-coverage-20260714
    paths:
      - .github/workflows/_validate_full_window_absence_coverage.yml

permissions:
  contents: write

concurrency:
  group: full-window-absence-coverage-20260714
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run schedule coverage gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-window-absence-coverage-tests.mjs
          npm run --silent test:foundation
          npm run --silent test:schedule-ai
          npm run --silent test:scheduler-overhaul
          npm audit --omit=dev --audit-level=high

      - name: Publish clean tested source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_validate_full_window_absence_coverage.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize full-window absence coverage guard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
