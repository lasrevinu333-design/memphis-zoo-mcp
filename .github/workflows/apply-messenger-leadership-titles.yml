name: Apply Messenger Leadership Titles

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/apply-messenger-leadership-titles.mjs'
      - '.github/workflows/apply-messenger-leadership-titles.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Messenger title transformation
        run: node .batch/apply-messenger-leadership-titles.mjs
      - name: Verify source and authority tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/messaging-api.js
          node --check scripts/messaging-manager-authority-tests.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run --silent test:messaging-manager-authority
          npm run --silent test:messaging
          git diff --check
      - name: Commit transformed files
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/messaging-api.js scripts/messaging-manager-authority-tests.mjs
          git commit -m 'fix: expose actual leadership titles in Messenger'
          git push origin HEAD:"$HEAD_BRANCH"
