name: Apply Foundation Repair V1

on:
  push:
    branches:
      - repair/foundation-repair-v1-20260716
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-foundation-repair-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/foundation-repair-v1-20260716
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply deterministic source repair
        id: apply_source
        shell: bash
        run: |
          set -uo pipefail
          cat .foundation-transfer/apply-00.py .foundation-transfer/apply-01.py .foundation-transfer/apply-02.py > /tmp/apply-foundation-repair.py
          {
            echo '=== combined apply script sha ==='
            sha256sum /tmp/apply-foundation-repair.py
            echo '=== syntax check ==='
            python3 -m py_compile /tmp/apply-foundation-repair.py
            echo '=== application ==='
            python3 /tmp/apply-foundation-repair.py
            echo '=== diff check ==='
            git diff --check
          } > /tmp/foundation-apply.log 2>&1
          rc=$?
          cat /tmp/foundation-apply.log
          exit "$rc"
      - name: Upload deterministic apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-repair-apply-diagnostics
          path: |
            /tmp/foundation-apply.log
            /tmp/apply-foundation-repair.py
            src/schedule-api.js
            src/routes/moxie.js
            scripts/scheduler-alerts-gps-foundation-tests.mjs
            supabase/migrations/20260716150000_foundation_repair_v1.sql
          if-no-files-found: warn
          retention-days: 2
      - name: Install and validate complete backend matrix
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          while IFS= read -r file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          npm audit --omit=dev --audit-level=high
          tests=(
            custodial-operational-notes-tests.mjs
            dashboard-recent-activity-contract-tests.mjs
            demo-leadership-blank-schedule-tests.mjs
            device-credential-foundation-tests.mjs
            events-api-contract-tests.mjs
            events-parser-tests.mjs
            feedback-contract-tests.mjs
            foundation-repair-tests.mjs
            full-window-absence-coverage-tests.mjs
            manager-open-session-foundation-tests.mjs
            memphis-messaging-regression-tests.mjs
            memphis-messaging-route-recovery-tests.mjs
            moxie-route-tests.mjs
            operational-recovery-tests.mjs
            sch2-publish-route-tests.mjs
            schedule-ai-tests.mjs
            schedule-display-tests.mjs
            schedule-source-type-contract-tests.mjs
            scheduler-alerts-gps-foundation-tests.mjs
            scheduler-overhaul-contract-tests.mjs
            shared-access-auth-tests.mjs
            smoke-ai-intent.mjs
            smoke-ai-utils.mjs
            smoke-memphis-context.mjs
            smoke.mjs
            thursday-notification-presentation-tests.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            node "scripts/$test_file"
          done
      - name: Commit verified application source
        shell: bash
        run: |
          set -euo pipefail
          git add src/schedule-api.js src/routes/moxie.js scripts/scheduler-alerts-gps-foundation-tests.mjs supabase/migrations/20260716150000_foundation_repair_v1.sql
          git config user.name 'custodial-foundation-bot'
          git config user.email 'custodial-foundation-bot@users.noreply.github.com'
          git commit -m 'fix: apply foundation repair v1 [skip ci]'
          git push origin HEAD:repair/foundation-repair-v1-20260716
