name: Full System Audit Source Snapshot

on:
  push:
    branches:
      - audit/full-system-source-20260716

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build immutable tracked-source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > commit.txt
          git ls-tree -r --name-only HEAD > tracked-files.txt
          git archive --format=tar HEAD | gzip -9 > custodial-backend-source.tar.gz
          sha256sum custodial-backend-source.tar.gz > custodial-backend-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: custodial-backend-current-source
          path: |
            custodial-backend-source.tar.gz
            custodial-backend-source.sha256
            commit.txt
            tracked-files.txt
          if-no-files-found: error
          retention-days: 2
