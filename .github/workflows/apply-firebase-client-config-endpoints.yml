name: Apply Firebase Client Config Endpoints

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/apply-firebase-client-config-endpoints.mjs'
      - '.github/workflows/apply-firebase-client-config-endpoints.yml'
      - 'scripts/manager-notification-contract-tests.mjs'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Firebase config endpoint transformation
        run: node .batch/apply-firebase-client-config-endpoints.mjs
      - name: Verify Firebase client artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check src/manager-notifications.js
          node --check scripts/manager-notification-contract-tests.mjs
          npm run --silent test:manager-notifications
          npm run --silent test:operations-leadership-mobile
          git diff --check
      - name: Commit transformed backend
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/manager-notifications.js scripts/manager-notification-contract-tests.mjs
          git commit -m 'feat: expose Firebase client config artifacts for native builds'
          git push origin HEAD:"$HEAD_BRANCH"
