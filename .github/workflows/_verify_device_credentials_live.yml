name: Verify Device Credentials Live

on:
  push:
    branches:
      - verify/device-credentials-live-20260715
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Poll live deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://memphis-zoo-mcp.onrender.com'
          for attempt in $(seq 1 20); do
            version="$(curl -fsS --max-time 30 "$base/version" || true)"
            health="$(curl -fsS --max-time 30 "$base/messaging-api/health" || true)"
            status="$(curl -fsS --max-time 30 "$base/device-auth/status?device_id=KIOSK_02" || true)"
            printf 'attempt=%s\nversion=%s\nhealth=%s\nstatus=%s\n' "$attempt" "$version" "$health" "$status"
            if grep -q 'release-2026.07.15.device-credentials.1' <<<"$version" \
              && grep -q '"ok":true' <<<"$health" \
              && grep -q '"policy_mode":"enroll"' <<<"$status" \
              && grep -q '"enrollment_required":true' <<<"$status" \
              && grep -q '"canonical_device_id":"KIOSK_02"' <<<"$status"; then
              exit 0
            fi
            sleep 20
          done
          exit 1
