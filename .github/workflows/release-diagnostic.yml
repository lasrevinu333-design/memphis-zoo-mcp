name: Backend Release Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and contract diagnostics
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/backend-release-contracts.log
          overall=0
          while IFS= read -r file; do
            echo "===== node --check $file =====" | tee -a /tmp/backend-release-contracts.log
            node --check "$file" 2>&1 | tee -a /tmp/backend-release-contracts.log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then overall=1; fi
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          for command in \
            test:events-parser test:events-api test:feedback test:schedule-ai test:ai-intent \
            test:messaging test:auth test:dashboard test:scheduler-overhaul test:sch2-publish \
            test:foundation test:schedule-display test:messaging-recovery test:messaging-incremental \
            test:messaging-manager-authority test:moxie-route test:schedule-source-type \
            test:device-credentials test:operational-recovery test:foundation-repair \
            test:custodial-repair test:device-security-app test:gemini-console test:schema-fingerprint \
            test:operations-leadership-mobile test:manager-notifications; do
            echo "===== npm run $command =====" | tee -a /tmp/backend-release-contracts.log
            npm run --silent "$command" 2>&1 | tee -a /tmp/backend-release-contracts.log
            status=${PIPESTATUS[0]}
            echo "===== exit $status: $command =====" | tee -a /tmp/backend-release-contracts.log
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - name: Package auditable source
        if: always()
        shell: bash
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/mcp-pr-source.tar.gz .
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-diagnostic
          path: |
            /tmp/backend-release-contracts.log
            /tmp/mcp-pr-source.tar.gz
          if-no-files-found: error
      - name: Enforce contracts
        if: always()
        run: test "${{ steps.contracts.outcome }}" = success
