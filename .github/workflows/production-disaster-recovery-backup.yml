name: Production disaster-recovery backup

on:
  workflow_dispatch:
    inputs:
      runtime_contract_source:
        description: Current target contract or exact observed fc2b predeployment source
        required: true
        type: choice
        options:
          - current
          - observed-fc2b-predeploy
        default: current
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: production-disaster-recovery-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Require configured recovery secrets
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_MANIFEST_SIGNING_KEY: ${{ secrets.BACKUP_MANIFEST_SIGNING_KEY }}
          BACKUP_MANIFEST_SIGNING_KEY_ID: ${{ vars.BACKUP_MANIFEST_SIGNING_KEY_ID }}
          BACKUP_RUNTIME_CONFIGURATION_JSON: ${{ vars.DISASTER_RECOVERY_RUNTIME_CONFIGURATION_JSON }}
        run: |
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          test -n "$BACKUP_MANIFEST_SIGNING_KEY"
          test -n "$BACKUP_MANIFEST_SIGNING_KEY_ID"
          test -n "$BACKUP_RUNTIME_CONFIGURATION_JSON"
      - name: Select current or exact observed runtime contract
        env:
          RUNTIME_CONTRACT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_contract_source || 'current' }}
          BACKUP_EVENT_NAME: ${{ github.event_name }}
          BACKUP_RUNTIME_CONFIGURATION_JSON: ${{ vars.DISASTER_RECOVERY_RUNTIME_CONFIGURATION_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'OBSERVED_RUNTIME_SOURCE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {validateRecoveryRuntimeConfiguration} from './scripts/disaster-recovery-runtime-contract.mjs';
          import {stableJsonFile} from './scripts/disaster-recovery-crypto.mjs';
          const EXPECTED_PROJECT="rqquvtjdmugpigbndmne";
          const EXPECTED_RELEASE={"release_id":"release-2026.07.19.custodial-v3.12","backend_commit":"fc2b989d19246ffd447c4c7cfb2590ac19bbcd27","frontend_commit":"6fae503111ef21c40a309913965c3b963043aa01","migration_head":"20260920010000","migration_manifest_sha256":"8af6170072e7971f0526538f9477f6ef2063a046190cf414b04db31b9c81ea3e","environment_contract_version":"memphis-zoo.disaster-recovery-runtime-contract.v1","status":"deployed","details_json":{"static_render_commit":"24af9e4c0e30edab9a3d6b0ea4b3785c8e0bc7c8","recovery_service_identity":{"backend":{"public_url":"https://memphis-zoo-mcp.onrender.com","service_id":"srv-d7fsvg57vvec73bhe2r0","deployment_id":"dep-dat87vbfbuks73955eeg","deployment_commit":"fc2b989d19246ffd447c4c7cfb2590ac19bbcd27"},"static_weekly_control_plane":{"public_url":"https://memphis-zoo-static-weekly-control-plane.onrender.com","service_id":"srv-da56jjou01pc73e67dn0","deployment_id":"dep-daqs8te1egvs73dc6920","deployment_commit":"24af9e4c0e30edab9a3d6b0ea4b3785c8e0bc7c8"}}}};
          const SOURCE_COMMIT='fc2b989d19246ffd447c4c7cfb2590ac19bbcd27';
          const SOURCE_PATH='release/disaster-recovery-runtime-contract.json';
          const SOURCE_BLOB="40c824d5870979e290164fe348e64be3c2b52e98";
          const SOURCE_RAW_SHA='f6506ebe41cdd7d2bf8a9f7e3484c07bb7df9f905c430590ab8e34a278759c6c';
          const SOURCE_STABLE_SHA='c6cc3990052b13b1d37338191086e8258f119f8ecf0b44ec1036095f5328594e';
          function requireObservedSourceChoice(selection,eventName,configuration){
            if(selection==='current')return false;
            if(selection!=='observed-fc2b-predeploy'||eventName!=='workflow_dispatch')throw new Error('Unsupported runtime contract source choice.');
            if(!configuration||typeof configuration!=='object'||Array.isArray(configuration)||configuration.project_ref!==EXPECTED_PROJECT)throw new Error('Observed runtime source project differs.');
            for(const key of ['release_id','backend_commit','frontend_commit','migration_head'])if(configuration[key]!==EXPECTED_RELEASE[key])throw new Error('Observed runtime source release tuple differs.');
            return true;
          }
          function verifiedObservedSourceContract(source,configuration){
            if(!source||source.type!=='file'||source.path!==SOURCE_PATH||source.encoding!=='base64'||source.size!==2028||source.sha!==SOURCE_BLOB||typeof source.content!=='string')throw new Error('Observed committed runtime contract identity differs.');
            const raw=Buffer.from(source.content,'base64');
            if(raw.length!==2028||createHash('sha256').update(raw).digest('hex')!==SOURCE_RAW_SHA||createHash('sha1').update(Buffer.concat([Buffer.from('blob '+raw.length+'\0'),raw])).digest('hex')!==SOURCE_BLOB)throw new Error('Observed committed runtime contract bytes differ.');
            const contract=JSON.parse(raw.toString('utf8'));
            if(createHash('sha256').update(stableJsonFile(contract)).digest('hex')!==SOURCE_STABLE_SHA)throw new Error('Observed signed backup runtime contract differs.');
            validateRecoveryRuntimeConfiguration({contract,configuration,releaseIdentity:EXPECTED_RELEASE,projectRef:EXPECTED_PROJECT});
            return raw;
          }
          const selection=process.env.RUNTIME_CONTRACT_SOURCE||'current';
          const configuration=selection==='current'?null:JSON.parse(process.env.BACKUP_RUNTIME_CONFIGURATION_JSON||'null');
          if(requireObservedSourceChoice(selection,process.env.BACKUP_EVENT_NAME,configuration)){
            const response=execFileSync('/usr/bin/gh',['api','-H','Accept: application/vnd.github+json','-H','X-GitHub-Api-Version: 2026-03-10','--method','GET','repos/lasrevinu333-design/memphis-zoo-mcp/contents/'+SOURCE_PATH+'?ref='+SOURCE_COMMIT],{encoding:'utf8',timeout:30000,maxBuffer:16384});
            const raw=verifiedObservedSourceContract(JSON.parse(response),configuration);
            const temp=fs.realpathSync(process.env.RUNNER_TEMP);if(fs.statSync(temp).uid!==process.getuid()||/[\r\n]/.test(temp))throw new Error('Owned runtime contract temporary directory required.');
            const output=path.join(temp,'observed-fc2b-predeploy-runtime-contract.json');
            fs.writeFileSync(output,raw,{flag:'wx',mode:0o600});
            fs.appendFileSync(process.env.GITHUB_ENV,'BACKUP_RUNTIME_CONTRACT_PATH='+output+'\n');
            console.log(JSON.stringify({runtime_contract_scope:'exact_observed_source_predeployment',source_commit:SOURCE_COMMIT,raw_contract_sha256:SOURCE_RAW_SHA,signed_archive_contract_sha256:SOURCE_STABLE_SHA,observed_release_id:EXPECTED_RELEASE.release_id,observed_backend_commit:EXPECTED_RELEASE.backend_commit,tool_node:process.versions.node,current_deployment_contract_unchanged:true}));
          }
          OBSERVED_RUNTIME_SOURCE
      - name: Bind backup tooling to the exact source tree
        run: |
          echo "BACKUP_TOOL_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BACKUP_TOOL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "BACKUP_PG_DUMP_IMAGE=supabase/postgres@sha256:fbf77524fc188126c1775fd2d2e54040bde295438a3e6f07936f3c39e6f688ed" >> "$GITHUB_ENV"
      - name: Pull exact schema-capture tooling before opening the database snapshot
        run: |
          set -euo pipefail
          docker pull "$BACKUP_PG_DUMP_IMAGE"
      - name: Capture schema, database, and Storage under one exported snapshot
        env:
          BACKUP_DIR: ${{ runner.temp }}/memphis-zoo-backup
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_CA_CERT_PATH: ${{ github.workspace }}/.github/certs/prod-ca-2021.crt
          BACKUP_MANIFEST_SIGNING_KEY: ${{ secrets.BACKUP_MANIFEST_SIGNING_KEY }}
          BACKUP_MANIFEST_SIGNING_KEY_ID: ${{ vars.BACKUP_MANIFEST_SIGNING_KEY_ID }}
          BACKUP_RUNTIME_CONFIGURATION_JSON: ${{ vars.DISASTER_RECOVERY_RUNTIME_CONFIGURATION_JSON }}
        run: npm run backup:production
      - name: Verify restore archive without applying writes
        env:
          RESTORE_SOURCE_DIR: ${{ runner.temp }}/memphis-zoo-backup
          RESTORE_ARCHIVE_VERIFY_KEY: ${{ secrets.BACKUP_MANIFEST_SIGNING_KEY }}
          RESTORE_ARCHIVE_VERIFY_KEY_ID: ${{ vars.BACKUP_MANIFEST_SIGNING_KEY_ID }}
        run: npm run restore:verify
      - name: Encrypt archive
        env:
          BACKUP_DIR: ${{ runner.temp }}/memphis-zoo-backup
          ARCHIVE_PATH: ${{ runner.temp }}/memphis-zoo-backup.tar.gz
          ENCRYPTED_PATH: ${{ runner.temp }}/memphis-zoo-backup.tar.gz.enc
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          tar -C "$BACKUP_DIR" -czf "$ARCHIVE_PATH" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in "$ARCHIVE_PATH" -out "$ENCRYPTED_PATH" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memphis-zoo-disaster-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/memphis-zoo-backup.tar.gz.enc
          retention-days: 14
          if-no-files-found: error
