name: Operations Leadership Mobile Foundation

on:
  pull_request:
    paths:
      - 'src/leadership-bootstrap.js'
      - 'src/custodial-employee-admin.js'
      - 'src/manager-notifications.js'
      - 'src/annie-moxie-bootstrap.js'
      - 'src/index.js'
      - 'supabase/migrations/20260721190000_operations_leadership_mobile_foundation.sql'
      - 'supabase/migrations/20260721203000_manager_mobile_notifications.sql'
      - 'supabase/migrations/20260722143000_custodial_employee_phone_foundation.sql'
      - 'supabase/migrations/20260722143100_custodial_employee_phone_assignment.sql'
      - 'supabase/migrations/20260722143200_custodial_employee_status_management.sql'
      - 'supabase/migrations/20260722143300_retire_forced_operations_leadership_thread.sql'
      - 'scripts/operations-leadership-mobile-contract-tests.mjs'
      - 'scripts/manager-notification-contract-tests.mjs'
      - 'scripts/operations-leadership-mobile-database-tests.mjs'
      - 'scripts/custodial-employee-phone-contract-tests.mjs'
      - 'scripts/custodial-employee-admin-authorization-tests.mjs'
      - 'scripts/custodial-employee-phone-database-tests.mjs'
      - 'package.json'
      - '.github/workflows/operations-leadership-mobile-foundation.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm run test:operations-leadership-mobile
      - run: npm run test:manager-notifications
      - run: npm run test:custodial-employee-phones
      - run: npm run test:messaging
      - run: npm run test:messaging-manager-authority
      - run: npm run test:device-credentials
      - name: Rebuild migrations and verify named leadership database
        id: schema_rebuild
        continue-on-error: true
        env:
          SCHEMA_REBUILD_DOCKER_IMAGE: supabase/postgres@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453
        shell: bash
        run: |
          set -o pipefail
          export SCHEMA_REBUILD_KEEP_DATABASE=1
          npm run --silent test:empty-db-rebuild 2>&1 | tee /tmp/operations-leadership-schema-rebuild.log
          container="$(sed -n 's/.*"retained_test_container":"\([^"]*\)".*/\1/p' /tmp/operations-leadership-schema-rebuild.log | tail -n 1)"
          test -n "$container"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          OPERATIONS_LEADERSHIP_TEST_DOCKER_CONTAINER="$container" \
            OPERATIONS_LEADERSHIP_TEST_DATABASE=postgres \
            npm run --silent test:operations-leadership-mobile-db 2>&1 | tee -a /tmp/operations-leadership-schema-rebuild.log
          CUSTODIAL_PHONE_TEST_DOCKER_CONTAINER="$container" \
            CUSTODIAL_PHONE_TEST_DATABASE=postgres \
            npm run --silent test:custodial-employee-phones-db 2>&1 | tee -a /tmp/operations-leadership-schema-rebuild.log
      - name: Upload schema rebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-leadership-schema-rebuild-log
          path: /tmp/operations-leadership-schema-rebuild.log
          if-no-files-found: error
      - name: Enforce schema rebuild result
        if: always()
        shell: bash
        run: test "${{ steps.schema_rebuild.outcome }}" = "success"
