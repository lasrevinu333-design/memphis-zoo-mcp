name: Bootstrap validated device credential backend

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bootstrap
          fetch-depth: 1
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          tr -d '[:space:]' < bootstrap/.foundation/device_credentials/device-credentials.patch.gz.b64 > /tmp/device-credentials.patch.gz.b64
          printf 'normalized_base64_sha=%s\n' "$(sha256sum /tmp/device-credentials.patch.gz.b64 | awk '{print $1}')"
          test "$(sha256sum /tmp/device-credentials.patch.gz.b64 | awk '{print $1}')" = '772d1bf2518d9f4ff8801dd41014101a86d42a30bd326b7ac0ff39fb74c5a78d'
          base64 -d /tmp/device-credentials.patch.gz.b64 | gzip -dc > /tmp/device-credentials.patch
          printf 'patch_sha=%s\n' "$(sha256sum /tmp/device-credentials.patch | awk '{print $1}')"
          test "$(sha256sum /tmp/device-credentials.patch | awk '{print $1}')" = '95a2dbf12c4de48f9c2a80c965cce3e6d2737f21cf98eb9a5be7d0d41af84b24'
          cd work
          git apply --check /tmp/device-credentials.patch
          git apply /tmp/device-credentials.patch
          git diff --check
      - name: Install exact dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Validate complete backend foundation
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          while IFS= read -r file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          npm audit --omit=dev --audit-level=high
          tests=(
            custodial-operational-notes-tests.mjs
            dashboard-recent-activity-contract-tests.mjs
            demo-leadership-blank-schedule-tests.mjs
            device-credential-foundation-tests.mjs
            events-api-contract-tests.mjs
            events-parser-tests.mjs
            feedback-contract-tests.mjs
            full-window-absence-coverage-tests.mjs
            manager-open-session-foundation-tests.mjs
            memphis-messaging-regression-tests.mjs
            memphis-messaging-route-recovery-tests.mjs
            moxie-route-tests.mjs
            sch2-publish-route-tests.mjs
            schedule-ai-tests.mjs
            schedule-display-tests.mjs
            schedule-source-type-contract-tests.mjs
            scheduler-alerts-gps-foundation-tests.mjs
            scheduler-overhaul-contract-tests.mjs
            shared-access-auth-tests.mjs
            smoke-ai-intent.mjs
            smoke-ai-utils.mjs
            smoke-memphis-context.mjs
            smoke.mjs
            thursday-notification-presentation-tests.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            node "scripts/$test_file"
          done
          grep -q 'force row level security' supabase/migrations/20260715213000_device_credential_foundation.sql
          grep -q 'device_auth_consume_enrollment_code' supabase/migrations/20260715213000_device_credential_foundation.sql
          grep -q 'confirmed_at' supabase/migrations/20260715213000_device_credential_foundation.sql
          grep -q 'Access-Control-Expose-Headers.*X-Device-Enrollment-Required' src/index.js
          ! grep -R -nE 'localStorage.*device.*credential|device.*credential.*localStorage' src scripts
      - name: Publish clean implementation branch
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B foundation/device-credentials-clean-20260715
          git add -- \
            .github/workflows/device-credential-foundation.yml \
            package.json \
            scripts/device-credential-foundation-tests.mjs \
            scripts/feedback-contract-tests.mjs \
            scripts/scheduler-alerts-gps-foundation-tests.mjs \
            scripts/smoke-memphis-context.mjs \
            src/app-version.js \
            src/auth/device-credential-auth.js \
            src/index.js \
            src/messaging-api.js \
            src/schedule-api.js \
            supabase/migrations/20260715213000_device_credential_foundation.sql
          test -z "$(git status --porcelain | grep '^??' | grep -v '^?? node_modules/' || true)"
          git commit -m 'security: add staged employee-device credentials'
          git push origin HEAD:refs/heads/foundation/device-credentials-clean-20260715 --force
          echo "clean_commit=$(git rev-parse HEAD)"
