name: Validate My Schedule contract hotfix

on:
  push:
    branches:
      - fix/my-schedule-contract-20260714
    paths:
      - .github/workflows/_apply_my_schedule_contract_hotfix.yml

permissions:
  contents: write

concurrency:
  group: my-schedule-contract-hotfix-20260714
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify exact source invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD -- src/schedule-api.js supabase/migrations/20260714233000_my_schedule_contract_v3.sql
          node --check src/schedule-api.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('src/schedule-api.js','utf8');
          const required = [
            "Array.isArray(page.current_items)",
            "shift.shift_start",
            "shift.shift_end",
            "page.phase === 'before_shift'",
            "page.phase === 'after_shift'",
            "scheduleStatus = 'completed'",
          ];
          for (const needle of required) {
            if (!source.includes(needle)) throw new Error(`Missing My Schedule invariant: ${needle}`);
          }
          if ((source.match(/function combineFullDaySchedule/g) || []).length !== 1) {
            throw new Error('combineFullDaySchedule must exist exactly once');
          }
          console.log('MY_SCHEDULE_SOURCE_INVARIANTS_PASS');
          NODE

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run schedule regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent test:foundation
          npm run --silent test:schedule-ai
          npm run --silent test:leadership-demo
          npm run --silent test:scheduler-overhaul
          npm run --silent test:sch2-publish
          npm audit --omit=dev --audit-level=high

      - name: Publish clean tested source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/_apply_my_schedule_contract_hotfix.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize My Schedule current and full-day contract'
          git push origin "HEAD:${GITHUB_REF_NAME}"
