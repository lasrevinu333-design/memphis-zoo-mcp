name: Device credentials source snapshot

on:
  push:
    branches:
      - foundation/device-credentials-20260715

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build source archive
        run: |
          git archive --format=tar.gz --output=/tmp/memphis-zoo-mcp-device-credentials-source.tar.gz HEAD
          sha256sum /tmp/memphis-zoo-mcp-device-credentials-source.tar.gz > /tmp/memphis-zoo-mcp-device-credentials-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: memphis-zoo-mcp-device-credentials-source
          path: |
            /tmp/memphis-zoo-mcp-device-credentials-source.tar.gz
            /tmp/memphis-zoo-mcp-device-credentials-source.tar.gz.sha256
          retention-days: 1
