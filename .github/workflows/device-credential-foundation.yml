name: Device Credential Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - foundation/device-credentials-clean-20260715
      - codex/custodial-foundation-repair-20260717

permissions:
  contents: read

concurrency:
  group: device-credential-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          npm audit --omit=dev --audit-level=high
      - name: Run complete backend contract matrix
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            custodial-operational-notes-tests.mjs
            dashboard-recent-activity-contract-tests.mjs
            demo-leadership-blank-schedule-tests.mjs
            device-credential-foundation-tests.mjs
            events-api-contract-tests.mjs
            events-parser-tests.mjs
            feedback-contract-tests.mjs
            foundation-repair-tests.mjs
            full-window-absence-coverage-tests.mjs
            manager-shared-48-hour-enrollment-tests.mjs
            memphis-messaging-regression-tests.mjs
            memphis-messaging-route-recovery-tests.mjs
            moxie-route-tests.mjs
            sch2-publish-route-tests.mjs
            schedule-ai-tests.mjs
            schedule-display-tests.mjs
            schedule-source-type-contract-tests.mjs
            scheduler-alerts-gps-foundation-tests.mjs
            scheduler-overhaul-contract-tests.mjs
            smoke-ai-intent.mjs
            smoke-ai-utils.mjs
            smoke-memphis-context.mjs
            smoke.mjs
            thursday-notification-presentation-tests.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            node "scripts/$test_file"
          done
      - name: Device-credential security invariants
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260715213000_device_credential_foundation.sql'
          if [ ! -f "$migration" ]; then migration='supabase/legacy_migrations/20260715213000_device_credential_foundation.sql'; fi
          grep -q 'force row level security' "$migration"
          grep -q 'device_auth_consume_enrollment_code' "$migration"
          grep -q 'confirmed_at' "$migration"
          grep -q 'Access-Control-Expose-Headers.*X-Device-Enrollment-Required' src/index.js
          ! grep -R -nE 'localStorage.*device.*credential|device.*credential.*localStorage' src scripts
