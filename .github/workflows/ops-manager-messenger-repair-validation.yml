name: Ops Manager Messenger Repair Validation

on:
  push:
    branches:
      - agent/ops-manager-messenger-bootstrap-decoupling-20260807

permissions:
  contents: write

concurrency:
  group: ops-manager-messenger-repair-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[messenger-repair-validation-passed]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ops-manager-messenger-bootstrap-decoupling-20260807

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused normal, denial, send, read, reconnect, and regression paths
        shell: bash
        run: |
          set -o pipefail
          {
            node --check src/messaging-api.js
            node scripts/ops-manager-messenger-bootstrap-source-tests.mjs
            npm run --silent test:messaging-manager-authority
            node scripts/ops-manager-shared-messenger-tests.mjs
            npm run --silent test:messaging
            npm run --silent test:messaging-recovery
            npm run --silent test:messaging-incremental
            git diff --check
          } 2>&1 | tee /tmp/ops-manager-messenger-repair-validation.txt

      - name: Retire one-shot validator after success
        shell: bash
        run: |
          rm .github/workflows/ops-manager-messenger-repair-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ops-manager-messenger-repair-validation.yml
          git commit -m "Record Messenger repair validation [messenger-repair-validation-passed]"
          git push origin HEAD:agent/ops-manager-messenger-bootstrap-decoupling-20260807

      - name: Upload focused validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-manager-messenger-repair-validation
          path: /tmp/ops-manager-messenger-repair-validation.txt
          if-no-files-found: warn
          retention-days: 14
