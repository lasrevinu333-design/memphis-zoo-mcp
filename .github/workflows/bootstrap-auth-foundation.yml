name: Bootstrap authentication foundation branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: bootstrap-authentication-foundation-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'foundation/security-control-plane-20260715'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install exact audited payload when staged
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.foundation-payload/backend/part-*' >/dev/null; then
            cat .foundation-payload/backend/part-* > /tmp/payload.b64
            base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
            echo "751fafcc05febf508f8cc7423ca023c1aa9ea9f5f0f3bc710148eafb794b3901  /tmp/payload.tar.gz" | sha256sum -c -
            tar -xzf /tmp/payload.tar.gz
            rm -rf .foundation-payload/backend
            rm -f .github/workflows/foundation-security-gate.yml
            git checkout HEAD -- .github/workflows/_apply-auth-foundation.yml
          fi
      - name: Validate foundation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check src/index.js
          node --check src/auth/shared-access-auth.js
          node --check src/auth/mcp-connector-auth.js
          npm run --silent test:auth
          npm run --silent test:manager-open
          npm run --silent test:messaging
          npm run --silent test:moxie-route
          npm run --silent test:schedule-source-type
          npm run --silent test:foundation
          npm audit --omit=dev --audit-level=high
      - name: Commit validated non-workflow changes when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: establish one-time trusted-device authentication"
          git push origin HEAD:${{ github.head_ref }}
