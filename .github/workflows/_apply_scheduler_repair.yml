name: Apply audited scheduler repair

on:
  push:
    branches:
      - repair/scheduler-alerts-gps-20260714
    paths:
      - .github/workflows/_apply_scheduler_repair.yml

permissions:
  contents: write

concurrency:
  group: scheduler-repair-backend-final
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main before testing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rev-parse HEAD > /tmp/base_after_merge

      - name: Checkout exact frontend fixtures
        uses: actions/checkout@v4
        with:
          repository: lasrevinu333-design/Engine
          ref: main
          path: _engine_fixture
          sparse-checkout: |
            memphis-auth.js
            start_page1.html
            gemini-admin.html
            system-feedback.html
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct audited source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/backend_patch_chunks/chunk_* | base64 --decode | gzip --decompress > /tmp/backend.patch
          printf '%s  %s\n' '954a7ff7c2ddf2fac53cc9d7ba956ec5e22a0f030e77b7d4fb4dafa5f5cfb17c' /tmp/backend.patch | sha256sum --check
          git apply --check /tmp/backend.patch
          git apply /tmp/backend.patch
          git diff --check
          if grep -R -nE 'packages\.applied|artifactory|internal\.api\.openai' package.json package-lock.json; then
            echo 'Internal package URL found in committed dependency metadata.' >&2
            exit 1
          fi
          rm -rf ../Engine
          mkdir -p ../Engine
          cp _engine_fixture/memphis-auth.js ../Engine/
          cp _engine_fixture/start_page1.html ../Engine/
          cp _engine_fixture/gemini-admin.html ../Engine/
          cp _engine_fixture/system-feedback.html ../Engine/

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run complete backend gate and capture every failure
        id: gate
        shell: bash
        run: |
          set +e
          report=/tmp/backend_test_diagnostics.txt
          : > "$report"
          failed=0
          printf 'node=%s\nnpm=%s\nworkflow_commit=%s\nbase_after_merge=%s\n\n' \
            "$(node --version)" "$(npm --version)" "$GITHUB_SHA" "$(cat /tmp/base_after_merge)" >> "$report"
          for test_script in \
            smoke \
            test:foundation \
            test:events-parser \
            test:events-api \
            test:feedback \
            test:schedule-ai \
            test:ai-intent \
            test:messaging \
            test:auth \
            test:device-popups \
            test:thursday-demo \
            test:leadership-demo \
            test:dashboard \
            test:scheduler-overhaul \
            test:sch2-publish
          do
            safe_name="${test_script//[:\/]/_}"
            out="/tmp/${safe_name}.log"
            npm run --silent "$test_script" > "$out" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'PASS %s\n' "$test_script" >> "$report"
            else
              failed=1
              printf '\nFAIL %s rc=%s\n' "$test_script" "$rc" >> "$report"
              tail -n 220 "$out" >> "$report"
              printf '\n' >> "$report"
            fi
          done
          for file in src/*.js scripts/*.mjs; do
            node --check "$file" > /tmp/syntax.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'PASS syntax %s\n' "$file" >> "$report"
            else
              failed=1
              printf '\nFAIL syntax %s rc=%s\n' "$file" "$rc" >> "$report"
              cat /tmp/syntax.log >> "$report"
            fi
          done
          npm audit --omit=dev --audit-level=high > /tmp/audit.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            printf 'PASS npm-audit-high\n' >> "$report"
          else
            failed=1
            printf '\nFAIL npm-audit-high rc=%s\n' "$rc" >> "$report"
            tail -n 220 /tmp/audit.log >> "$report"
          fi
          printf '\nFAILED=%s\n' "$failed" >> "$report"
          cat "$report"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Publish tested source or preserve diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          if [ "${{ steps.gate.outputs.failed }}" = '0' ]; then
            rm -rf _engine_fixture .repair
            rm -f .github/workflows/_apply_scheduler_repair.yml
            git add -A
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'No source changes were produced.' >&2
              exit 1
            fi
            git commit -m 'Repair scheduler delivery, reminders, GPS, and kiosk identity'
          else
            git reset --hard "$(cat /tmp/base_after_merge)"
            mkdir -p .repair
            cp /tmp/backend_test_diagnostics.txt .repair/backend_test_diagnostics.txt
            git add .repair/backend_test_diagnostics.txt
            if git diff --cached --quiet; then
              git commit --allow-empty -m 'Record exact backend repair gate diagnostics'
            else
              git commit -m 'Record exact backend repair gate diagnostics'
            fi
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
