name: Apply audited scheduler repair

on:
  push:
    branches:
      - repair/scheduler-alerts-gps-20260714
    paths:
      - .repair/backend_patch_chunks/**
      - .github/workflows/_apply_scheduler_repair.yml

permissions:
  contents: write

concurrency:
  group: scheduler-repair-backend
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frontend feedback fixture
        uses: actions/checkout@v4
        with:
          repository: lasrevinu333-design/Engine
          ref: main
          path: _engine_fixture
          sparse-checkout: system-feedback.html
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/backend_patch_chunks/chunk_* | base64 --decode | gzip --decompress > /tmp/backend.patch
          printf '%s  %s\n' '954a7ff7c2ddf2fac53cc9d7ba956ec5e22a0f030e77b7d4fb4dafa5f5cfb17c' /tmp/backend.patch | sha256sum --check
          git apply --check /tmp/backend.patch
          git apply /tmp/backend.patch
          mkdir -p ../Engine
          cp _engine_fixture/system-feedback.html ../Engine/system-feedback.html
          npm ci

      - name: Record every regression result without hiding the failing assertion
        shell: bash
        run: |
          set +e
          report=.repair/backend_test_diagnostics.txt
          : > "$report"
          printf 'node=%s\nnpm=%s\ncommit=%s\n\n' "$(node --version)" "$(npm --version)" "$GITHUB_SHA" >> "$report"
          failed=0
          for test_script in \
            test:foundation \
            test:events-parser \
            test:events-api \
            test:feedback \
            test:schedule-ai \
            test:ai-intent \
            test:messaging \
            test:auth \
            test:device-popups \
            test:thursday-demo \
            test:leadership-demo \
            test:dashboard \
            test:scheduler-overhaul \
            test:sch2-publish
          do
            safe_name="${test_script//[:\/]/_}"
            out="/tmp/${safe_name}.log"
            npm run --silent "$test_script" > "$out" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'PASS %s\n' "$test_script" >> "$report"
            else
              failed=1
              printf '\nFAIL %s rc=%s\n' "$test_script" "$rc" >> "$report"
              tail -n 160 "$out" >> "$report"
              printf '\n' >> "$report"
            fi
          done
          for file in src/*.js scripts/*.mjs; do
            node --check "$file" > /tmp/syntax.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failed=1
              printf '\nFAIL syntax %s rc=%s\n' "$file" "$rc" >> "$report"
              cat /tmp/syntax.log >> "$report"
            fi
          done
          npm audit --omit=dev --audit-level=high > /tmp/audit.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            printf 'PASS npm-audit-high\n' >> "$report"
          else
            failed=1
            printf '\nFAIL npm-audit-high rc=%s\n' "$rc" >> "$report"
            tail -n 160 /tmp/audit.log >> "$report"
          fi
          printf '\nFAILED=%s\n' "$failed" >> "$report"
          cat "$report"

      - name: Commit diagnostic evidence without publishing unverified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add .repair/backend_test_diagnostics.txt
          git commit -m 'Record exact backend repair gate diagnostics'
          git push origin "HEAD:${GITHUB_REF_NAME}"
